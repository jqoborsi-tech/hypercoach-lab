/* One exercise card of the workout screen — renderable on its own so logging
   a set swaps JUST this card in place instead of rebuilding the whole page
   (full re-renders made iOS jump to the top of the page on every tap). */
function wcard(si){
  const M=S.meso,D=S.draft,{w,d}=D;
  const deload=w>=M.weeks,rir=rirFor(w,M.weeks);
  const s=M.days[d].slots[si];
  const ex=EX[D.ex[si]]||EX[s.ex];
  const sets=D.sets[si]||[];
  const ts=sets.map((_,xi)=>nextTarget(ex.id,w,xi));
  const t=ts[0]||nextTarget(ex.id,w,0);
  const doneCt=sets.filter(x=>x.done).length,allDone=sets.length>0&&doneCt===sets.length;
  const cue=cueFor(ex.id);
  const wr=workRange(ex),li=loadInfo(ex);
  const wLabel=li.kind==='assist'?'assist '+unit():li.kind==='bw'?'+ '+unit():unit();
  // the whole set-by-set plan on one line: "175 × 9 · 8"
  const live=ts.filter(Boolean);
  const sameW=live.length&&live.every(x=>x.w===live[0].w);
  const planLine=!live.length?'':sameW
    ?(live[0].w>0?live[0].w+' × ':'')+[...live.map(x=>x.reps)].join(' · ')
    :live.map(x=>fmtSet(x.w,x.reps)).join(' · ');
  const used=Object.values(D.ex);
  const alt1=t&&t.pain?altFor(ex.id,used):null,alt2=alt1?altFor(ex.id,used.concat(alt1)):null;
  return `<div class="card ${allDone?'xdone':''}" id="xcard-${si}">
      <div class="row between">
        <span class="chip">${mdot(s.m)}<span ${mtint(s.m)}>${MUSCLES[s.m].name}</span>${cue&&cue.t?' · '+cue.t:''}</span>
        <span class="xs num ${allDone?'grn':'mut'}">${allDone?'✓ ':''}${doneCt}/${sets.length} sets</span>
      </div>
      <div class="xtitle">${esc(ex.name)}</div>
      <div class="row between" style="margin-bottom:6px">
        <span class="xs mut num">${sets.length} × ${deload?'easy reps':wr.lo+'–'+wr.top+' reps · '+rir+' RIR'}</span>
        <span class="row" style="gap:6px">
          <a class="ibtn play" href="${vidUrl(ex.id)}" target="_blank" rel="noopener" title="Form video" aria-label="Form video">▶</a>
          <button class="ibtn" title="Swap exercise" aria-label="Swap exercise" data-a="pick:${si}">⇄</button>
          <button class="ibtn" title="Remove from this day" aria-label="Remove from this day" data-a="rmex:${si}">✕</button>
        </span>
      </div>
      ${t?`<div class="cue tgt ${t.down?'warn':''}">
        <span class="st">🎯</span><span><b class="${t.down?'amb':'grn'} num">${planLine}</b>
        <span class="xs mut"> — ${esc(t.note)}</span></span></div>`
      :deload?'':`<div class="cue"><span class="st">🧭</span><span><b style="color:var(--ink)">First time on this lift.</b>
        Pick a ${li.kind==='assist'?'level of assistance':'weight'} you could ${li.kind==='bw'?'do':'lift'} for about
        ${wr.lo+1}–${wr.top} reps with ${rir} left in the tank. Whatever you log becomes your baseline.</span></div>`}
      ${alt1?`<div class="row wrap" style="gap:6px;margin:8px 0 2px"><span class="xs mut">Swap to:</span>
        ${[alt1,alt2].filter(Boolean).map(id=>`<button class="btn small" style="padding:7px 12px;font-size:.78rem" data-a="swapto:${si}:${id}">${esc(EX[id].name)}</button>`).join('')}</div>`:''}
      ${cue?`<div class="cue"><span class="st">${cue.s?'↔':'•'}</span><span>${cue.s?'<b class="chip stretch" style="margin-right:6px">STRETCH</b>':''}${esc(cue.c)}</span></div>`:''}
      ${li.kind==='assist'?`<p class="xs dim" style="margin:6px 2px 0">Enter the <b>assistance</b> weight — a lower number is harder.</p>`:''}
      <div class="setrow" style="margin-top:4px">
        <span></span><span class="xs dim" style="text-align:center">${wLabel}</span>
        <span class="xs dim" style="text-align:center">reps</span><span></span>
      </div>
      ${sets.map((x,xi)=>{const tx=ts[xi];
        const wph=tx?(tx.w>0?tx.w:(li.kind==='bw'?'BW':'')):'';
        return `<div class="setrow ${x.done?'done':''}">
        <span class="xs dim num">${xi+1}</span>
        <input class="in num" type="number" inputmode="decimal" value="${esc(x.w)}" placeholder="${wph}" data-in="w:${si}:${xi}" aria-label="Set ${xi+1} weight">
        <input class="in num" type="number" inputmode="numeric" value="${esc(x.r)}" placeholder="${tx?tx.reps:wr.lo+'–'+wr.top}" data-in="r:${si}:${xi}" aria-label="Set ${xi+1} reps">
        <button class="chk ${x.done?'on':''}" data-a="chk:${si}:${xi}" aria-label="${x.done?'Undo set':'Log set'} ${xi+1}">${x.done?setArrow(ex.id,w,xi,x):'✓'}</button>
      </div>`;}).join('')}

/* Strength history per lift, as CAPACITY (reps in reserve included) so a
   2-RIR week and a 0-RIR week sit on the same scale. Deload sets are skipped —
   they are deliberately easy and say nothing about strength. */
function exSessions(onlyMeso,raw){
  const out={};
  const scan=M=>{if(!M||!M.log)return;
    Object.keys(M.log).sort((a,b)=>{
      const[aw,ad]=a.split('_').map(Number),[bw,bd]=b.split('_').map(Number);
      return aw-bw||ad-bd;})
    .forEach(k=>{const l=M.log[k],wk=+k.split('_')[0];
      if(wk>=M.weeks)return;
      const rir=l.rir!=null?l.rir:rirFor(wk,M.weeks);
      (l.entries||[]).forEach(e=>{
        const ex=EX[e.ex];
        const best=e.sets.reduce((a,x)=>e1x(ex,x.w,x.r)>e1x(ex,a.w,a.r)?x:a,e.sets[0]);
        if(!best)return;
        (out[e.ex]=out[e.ex]||[]).push({date:l.date,est:Math.round((raw?e1x(ex,best.w,best.r):capOf(ex,{w:best.w,r:best.r,rir}))*10)/10,w:best.w,r:best.r});
      });});};
  if(onlyMeso)scan(onlyMeso);else{S.archive.forEach(scan);scan(S.meso);}
  return out;
}
/* What this block's log says: which lifts are moving, which have stalled,
   and how consistently the plan is being run. */
function blockInsights(){
  const M=S.meso;if(!M)return '';
  const ses=exSessions(M,true); // within a block: what you actually lifted, session to session
  const rows=Object.keys(ses).filter(id=>ses[id].length>=2).map(id=>{
    const a=ses[id].map(x=>x.est),n=a.length;
    const prevBest=n>=3?Math.max(...a.slice(0,n-2)):null;
    return {id,n,pct:(a[n-1]/a[0]-1)*100,
      stalled:n>=3&&a[n-1]<=prevBest*1.005&&a[n-2]<=prevBest*1.005};});
  const logs=Object.values(M.log),done=logs.filter(l=>!l.skipped).length,skipped=logs.filter(l=>l.skipped).length;
  if(!done)return '';
  const up=rows.filter(r=>r.pct>0.5).sort((a,b)=>b.pct-a.pct),stalled=rows.filter(r=>r.stalled);
  const avg=rows.length?rows.reduce((a,r)=>a+r.pct,0)/rows.length:null;
  const mins=logs.filter(l=>l.mins).map(l=>l.mins),avgMin=mins.length?Math.round(mins.reduce((a,b)=>a+b,0)/mins.length):0;
  const nm=id=>esc(EX[id]?EX[id].name:id);
  return `<div class="card">
    <div class="lbl" style="margin-bottom:10px">This block so far</div>
    <div class="stats" style="margin-bottom:${rows.length?12:0}px">
      <div class="stat"><b>${done}</b><span>workouts</span></div>
      ${skipped?`<div class="stat"><b>${skipped}</b><span>skipped</span></div>`:''}
      ${avg!==null?`<div class="stat"><b class="${avg>0.5?'grn':avg<-1?'amb':''}">${avg>0?'+':''}${avg.toFixed(1)}%</b><span>avg performance</span></div>`:''}
      ${avgMin?`<div class="stat"><b>${avgMin}</b><span>min / session</span></div>`:''}
    </div>
    ${up.length?`<div class="lbl" style="margin-bottom:2px">Moving up</div>
      ${up.slice(0,4).map(r=>`<div class="slotline"><span class="sm">${nm(r.id)}</span><span class="sm num grn">▲ ${r.pct.toFixed(1)}%</span></div>`).join('')}`:''}
    ${stalled.length?`<div class="lbl amb" style="margin:12px 0 2px">Stalled (3+ sessions flat)</div>
      ${stalled.slice(0,4).map(r=>`<div class="slotline"><span class="sm">${nm(r.id)}</span><span class="xs mut">${r.n} sessions</span></div>`).join('')}
      <p class="xs mut" style="margin-top:8px">One flat lift is normal. If it stays flat next block, swap it for a different
      lift for the same muscle (⇄ in the workout) — a fresh movement usually restarts progress. Several flat at once
      points at recovery: sleep, food, or too many sets.</p>`:''}
    ${!rows.length?'<p class="xs mut">Trends appear once a lift has been trained twice this block.</p>':''}
  </div>`;
}
function recentBests(){
  const ses=exSessions(),rows=[];
  Object.keys(ses).forEach(id=>{const last=ses[id][ses[id].length-1];
    rows.push({id,...last});});
  rows.sort((a,b)=>b.date<a.date?-1:1);
  if(!rows.length)return '<p class="sm mut">Nothing yet.</p>';
  return rows.slice(0,10).map(r=>`<div class="slotline">
    <span class="sm">${esc(EX[r.id]?EX[r.id].name:r.id)}</span>
    <span class="sm num mut">${r.w>0?r.w+' × ':''}${r.r} reps</span></div>`).join('');
}
function lineChart(pts){
  if(pts.length<2)return '<p class="sm mut">Need 2+ sessions.</p>';
  const W=320,H=120,P=8;
  const ys=pts.map(p=>p.y);
  let lo=Math.min(...ys),hi=Math.max(...ys);
  if(hi-lo<1){hi+=1;lo-=1;}
  const X=i=>P+(W-2*P)*i/(pts.length-1);
  const Y=v=>H-P-(H-2*P)*(v-lo)/(hi-lo);
  const line=pts.map((p,i)=>`${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');
  const area=`${P},${H-P} ${line} ${X(pts.length-1).toFixed(1)},${H-P}`;
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H+18}">
    <polygon points="${area}" fill="rgba(229,72,77,.12)"/>
    <polyline points="${line}" fill="none" stroke="var(--red)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${X(pts.length-1)}" cy="${Y(last.y)}" r="4" fill="var(--red)"/>
    <text x="${P}" y="${H+14}" fill="var(--dim)" font-size="10">${lo|0}</text>
    <text x="${W-P}" y="${H+14}" fill="var(--dim)" font-size="10" text-anchor="end">${hi|0} · latest ${last.y}</text>
  </svg>`;
}
function drawCharts(){
  const ses=exSessions();
  if(V.progEx&&ses[V.progEx]&&$('#exchart'))
    $('#exchart').innerHTML=lineChart(ses[V.progEx].map(s=>({y:s.est})));
  if(S.bw.length>1&&$('#bwchart'))
    $('#bwchart').innerHTML=lineChart(S.bw.map(b=>({y:b.v})));
}

    </div>
  </div>`:''}
  <div class="card">
    <div class="row between">
      <div><div class="lbl">Exercise library</div>
        <p class="xs mut">${libItems().length} movements with form videos — browse by muscle.</p></div>
      <button class="btn small" data-a="nav:library">Browse</button>
    </div>
  </div>
  <div class="card">
    <div class="lbl" style="margin-bottom:6px">Share this app</div>
    <p class="sm mut">Send the page link (browser share button) to family or friends. Each person's phone
    gets its own <b>fresh, independent copy</b> — their own profile questionnaire, their own program, their own data.
    Nothing is shared between devices. Tell them to open the link and tap
    <b>Share → Add to Home Screen</b> so it lives next to their other apps.</p>
  </div>
  <div class="card">
    <div class="lbl" style="margin-bottom:8px">How the algorithm works</div>
    <details><summary>Sets: enough to grow, never junk</summary>
      <p>Every lift gets <b>2–3 hard sets</b>, and a session tops out at 16 — past that, extra sets add
      fatigue faster than growth. Your week is measured in <b>effective sets per muscle</b>: each direct
      set counts once, and compound lifts give half-credit to the muscles that assist (a row is one back
      set and half a biceps set). The programs start the big muscles at 6–8 sets a week, the steep part of
      the dose-response curve, and each muscle has a recoverable ceiling the app won't push past.</p></details>
    <details><summary>Reps and load — double progression</summary>
      <p>Each set is coached against <b>the same set last time</b>: one more rep. Reps climb to the top of the
      working range (12 on big lifts, 15 on isolation), then the <b>weight steps up</b> and reps restart
      lower — the new target is worked out from your estimated max at the new load. If the next jump is
      too big to be productive (light dumbbells), reps keep climbing until it isn't. Heavy, concentrated
      sets — not cardio.</p></details>
    <details><summary>Effort — reps in reserve</summary>
      <p>RIR = how many reps you had left. The block ramps 2 → 1 → 0 RIR; the deload sits around 8 so every
      set feels easy. Targets know about it: if your RIR target drops, the rep you gain is "paid for" by the
      extra effort; when a new block starts easier than the last one ended, the target <b>backs off</b>
      instead of demanding a record on an easy day. Newer and 55+ lifters never get sent to failure.</p></details>
    <details><summary>The one-tap check-in</summary>
      <p><b>Had more in me</b> adds one set for up to two muscles next week — your Emphasized muscles first,
      then whichever has the most room — and skips any muscle whose strength just dipped.
      <b>Barely survived</b> takes one set off up to two muscles, starting with the ones that lost strength.
      <b>Just right</b> changes nothing. A single tap never swings your week by more than two sets.</p></details>
    <details><summary>What the app reads from your log</summary>
      <p>From weight × reps it estimates your strength on every lift (with reps-in-reserve counted, so an
      easier week isn't mistaken for a decline), tracks it per lift and per muscle, spots all-time bests and
      stalled lifts, starts a recovery timer for each muscle, and raises a fatigue alert if most of your lifts
      fall two sessions running. Pull-ups and dips include your bodyweight; assisted machines count the other
      way — less assistance is progress.</p></details>
    <details><summary>Your lifts, your body</summary>
      <p>No lift is mandatory. Swap anything (⇄) for another that hits the same muscle, add or remove lifts,
      and ⭐ favorites to have them programmed first. A new block starts from the lineup you <b>actually
      ran</b>, swaps included. A lift flagged for joint pain is held steady, offered for a one-tap swap, and
      replaced automatically in the next block.</p></details>
    <details><summary>Deload &amp; the next block</summary>
      <p>The final week cuts to <b>one easy set per exercise</b> at about half the reps —
      fatigue drops, muscle stays. Your ending weights carry into the next block, so overload
      compounds across blocks, not just inside one.</p></details>
  </div>
  <div class="card">
    <div class="lbl" style="margin-bottom:8px">Recovery (what actually works)</div>
    <details><summary>Sleep — the #1 recovery tool</summary>
      <p>Nothing you can buy beats it: <b>7–9 hours</b>, at consistent times — judge by the weekly average,
      so a short night can be repaid with longer ones. Wind down 30–45 min before bed, no caffeine after
      training, cool/dark/quiet room. Naps help: <b>20–30 minutes</b>, no longer.</p></details>
    <details><summary>Skip list — save your money</summary>
      <p>Per the sports-recovery research: massage, foam rolling, stretching, cupping, e-stim and
      BCAAs have <b>no measurable recovery effect</b> (foam rolling is fine for mobility). Ice baths and
      regular NSAIDs actively <b>blunt muscle adaptation</b> — skip them while trying to grow.
      What works: sleep, staying within your recoverable volume (this app's job), food, and lower life stress.</p></details>
    <details><summary>Rough week? Damage control</summary>
      <p>Bad sleep, work stress, or illness all drain the same recovery pool as training. On a rough day,
      cut the session to about <b>half the sets</b> and drop weights ~10–15% — a light session beats a missed
      one and beats a grinding one. Still struggling after 1–2 light sessions → deload (More → End meso early).
      Alcohol: 1–2 drinks is noise, 4+ measurably sets recovery back.</p></details>
    <details><summary>After 3–4 hard blocks: resensitize</summary>
      <p>Volume needs creep up as you adapt. After 3–4 progressively harder mesocycles, run one deliberately
      easy low-volume block (about half your usual sets, 4+ RIR) or take 1–2 weeks of active rest. Fatigue
      drains fully, and your muscles become <b>sensitive to lower volumes again</b> — you'll grow on less.</p></details>
  </div>
  <div class="card">
    <div class="lbl" style="margin-bottom:8px">Injury prevention</div>
    <p class="xs mut" style="margin-bottom:10px">The smart-lifting essentials you'll actually use. Volume rules (start low, add 1–2 sets, respect MRV, deload) are already automated by this app.</p>
    <details><summary>7 technique fundamentals</summary>
      <p>1. <b>Full, standardized ROM</b> — same depth every rep; less weight needed for the same growth.<br>
      2. <b>Controlled eccentrics</b> — slow the lowering; a brief pause at the bottom on pressing/pull-up moves. Injuries almost never happen on a controlled, paused eccentric.<br>
      3. <b>Control the end-range</b> — no throwing the weight at the top.<br>
      4. <b>No cheating</b> — momentum from other muscles hands your target muscle a weight it can't handle.<br>
      5. <b>Don't repeat painful positions</b> — sharp, localized, worsening pain means change something.<br>
      6. <b>No heavy + unstable combos</b> — going below ~8 reps? Prefer machines, stable feet, supported positions.<br>
      7. <b>Respect sketchy positions</b> — heavy rounded-back pulls, twisting under load: build up slowly or skip.</p></details>
    <details><summary>Warm-up protocol (auto-built for you)</summary>
      <p>Each workout's warm-up card ramps you to your first working weight: light set of 10–15, then 2–4 incrementally heavier, lower-rep sets (more steps the heavier the load), 30–60s rest between. Optional 1–4-rep potentiation set at working weight. Later exercises need just one light set of ~10 — more if that muscle is fresh. Golden rule: the days you least feel like warming up are the days to warm up <b>more</b>.</p></details>
    <details><summary>5 signs your fatigue is too high</summary>
      <p>1. Low desire to train &nbsp;2. Soreness that never fully heals week to week &nbsp;3. Feeling anxious/overwhelmed by workouts &nbsp;4. Appetite and sleep disruption &nbsp;5. A performance stall or decline lasting a full week.</p>
      <p><b>What to do:</b> one muscle underperforming → give it a recovery session (half the sets and load). Several signs at once → deload now (More → "End meso early"). Once or twice a year after months of hard training → an active-rest phase: one deload week + one full week away from the gym.</p></details>
    <details><summary>Post-injury comeback (6 phases)</summary>
      <p>After medical clearance, progress in order — each phase only when the last feels completely fine:<br>
      1. <b>ROM</b> — very light (25–30RM), expand pain-free range, 5+ RIR, 1–3 sets, 3–6×/wk.<br>
      2. <b>Reps</b> — 20–30RM, work from 3–4 RIR toward harder sets, 1–3 sets, 2–4×/wk.<br>
      3. <b>Sets</b> — same loads, cycle 3→0 RIR over weeks, add max 1 set/session.<br>
      4. <b>Load</b> — climb into 10–20RM, then 5–10RM if that's how you train; pauses + slow eccentrics.<br>
      5. <b>Cautious normal</b> — resume everything incl. the movement that hurt you; extra warm-up, technique focus.<br>
      6. <b>Normal training.</b> Small tweak? Compress phases 1–3 into one easy session. Never skip phases — let your body set the pace, not your ego.</p></details>
  </div>
  <div class="card">
    <div class="lbl" style="margin-bottom:8px">The science behind your program</div>
    <p class="xs mut" style="margin-bottom:10px">Verified against 2023–2025 meta-analyses &amp; RCTs (multi-source, adversarially fact-checked). Each principle is wired into how this app picks and cues your exercises.</p>
    <details><summary>Long muscle length is the master variable <span class="chip stretch" style="margin-left:4px">core</span></summary>
      <p>Training a muscle in its <b>stretched/lengthened position</b> is the single highest-leverage exercise-selection choice — at least equal to, likely better than, short-length work, with extra fascicle-length growth. Every exercise here carries a stretch cue, and strong long-length movements get a <b class="blu">STRETCH</b> tag.<br>
      <a class="sci-src" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10801605/" target="_blank" rel="noopener">Warneke 2023 review · PMC10801605</a></p></details>
    <details><summary>Full ROM ≈ lengthened partials</summary>
      <p>Both build essentially the same muscle — the <b>stretched position is the driver</b>, not which strategy you pick. So: use a full range that emphasizes the stretch, and when you hit failure, add 2–3 lengthened partials in the bottom.<br>
      <a class="sci-src" href="https://peerj.com/articles/18904/" target="_blank" rel="noopener">Wolf et al. 2025 · PeerJ 18904</a></p></details>
    <details><summary>Machines &amp; dumbbells = barbells for size</summary>
      <p>Four meta-analyses find <b>no hypertrophy difference</b> (effect size ≈0) between machines/cables/dumbbells and barbell compounds. For pure muscle &amp; body-comp goals you lose nothing by skipping heavy barbell squats/deadlifts/bench — the only free-weight edge is strength tested on free weights. This app is built entirely on that finding.<br>
      <a class="sci-src" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10426227/" target="_blank" rel="noopener">Haugen et al. 2023 · PMC10426227</a></p></details>
    <details><summary>Standing vs seated calf raise = different muscles</summary>
      <p>Straight-knee (standing/leg-press) calf raises grew the <b>gastrocnemius +12%</b> vs ~2% seated; bent-knee seated raises train the <b>soleus</b>. Both belong in your week — the app labels each calf exercise by the head it trains so you don’t double up.<br>
      <a class="sci-src" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10753835/" target="_blank" rel="noopener">Kinoshita et al. 2023 · PMC10753835</a></p></details>
    <details><summary>Exercise choice drives regional growth</summary>
      <p>Which lift you pick decides <b>which part</b> of a muscle grows, by stretching that region. Incline curls bias the upper (proximal) biceps; preacher curls the lower (distal). Your default arm day now pairs an incline-style curl with a second variant for full-muscle coverage.<br>
      <a class="sci-src" href="https://www.researchgate.net/publication/388004281" target="_blank" rel="noopener">Kassiano et al. 2025 · Int J Sports Med</a></p></details>
    <details><summary>Direct sets count once, assisting sets count half</summary>
      <p>The largest volume analysis to date found growth tracks weekly sets best when a set counts <b>fully for its prime mover and half for the muscles that assist</b> (biceps in a row, triceps in a press) — with more sets giving more growth at diminishing returns. The app counts your week exactly that way, programs direct work for every muscle, and keeps arm volume lean because compounds already top it up. (Preprint — not yet peer-reviewed; the direction matches earlier meta-analyses.)<br>
      <a class="sci-src" href="https://sportrxiv.org/index.php/server/preprint/view/460" target="_blank" rel="noopener">Pelland/Zourdos et al. 2024 · SportRxiv 460</a></p></details>
    <details><summary>About 4 sets a week is the floor</summary>
      <p>A review of time-efficient training concluded that <b>at least ~4 weekly sets per muscle</b> in the 6–15 rep range is the least that reliably builds muscle, that weekly volume matters more than how it's split up, and that multi-joint lifts give the most return per minute. The app flags any muscle that falls under that line in your week, and starts the big ones well above it.<br>
      <a class="sci-src" href="https://www.ncbi.nlm.nih.gov/pmc/articles/PMC8449772/" target="_blank" rel="noopener">Iversen et al. 2021 · Sports Med · PMC8449772</a></p></details>
    <details><summary>Close to failure — not past it</summary>
      <p>A 2024 meta-regression found muscle growth improves as sets end <b>closer to failure</b>, while strength gains are similar across a wide range of reps in reserve. So the block starts with a couple of reps in the tank and tightens toward 0 by its last hard week — and newer or 55+ lifters, who gain plenty a rep or two short, are never sent all the way.<br>
      <a class="sci-src" href="https://www.fau.edu/newsdesk/articles/muscle-growth-strength-study" target="_blank" rel="noopener">Robinson et al. 2024 · Sports Med 54(9)</a></p></details>
    <p class="xs dim" style="margin-top:8px">Caveat: several of these RCTs used untrained or small samples — treat magnitudes as directional, but the directions are consistent across the literature.</p>
  </div>

  </div>

    ${S.archive.map((a,i)=>`<div class="slotline">

      ${a.done?'':`<button class="btn small ghost" data-a="meso_resume:${i}">Resume</button>`}
    </div>`).join('')}
    <p class="xs dim" style="margin-top:6px">Resume swaps an unfinished block back in — your current one gets saved here.</p></div>`:''}
  <p class="xs dim" style="text-align:center;margin:8px 0 20px">Built on published hypertrophy, recovery &amp; sports-nutrition research.

const A={
  nav:s=>{V.screen=s;V.confirmReset=false;render();},
  setup_start:()=>{V.setup=newSetup();V.screen='setup';render();},
  su_days:k=>{k=+k;const st=V.setup;if(st.carried&&k===st.daysKey)return;st.daysKey=k;
    if(!PRESETS[st.preset])st.preset=recProgram(S.profile).preset||'balanced'; // was a template / carried-over lineup
    st.carried=false;st.days=buildDays(k,st.preset);render();},
  su_preset:k=>{const st=V.setup;st.preset=k;st.carried=false;
    if(!SPLITS[st.daysKey])st.daysKey=placement(S.profile).daysRec;
    st.days=buildDays(st.daysKey,k);render();},
  su_keep:()=>{const st=V.setup;if(!st._prevDays)return;
    st.days=JSON.parse(JSON.stringify(st._prevDays));st.daysKey=st.days.length;
    st.preset=st._prevPreset;st.carried=true;render();},
  swapto:arg=>{const[si,id]=arg.split(':');A.pick(si);A.pickex(id);},
  su_weeks:k=>{V.setup.weeks=+k;render();},
  su_prio:m=>{const pm=V.setup.prioMap=V.setup.prioMap||{};
    pm[m]=pm[m]==='E'?'M':pm[m]==='M'?'G':'E';
    if(pm[m]==='G')delete pm[m];
    V.setup.prios=Object.keys(pm).filter(k=>pm[k]==='E'); // legacy field
    render();},
  su_next:()=>{V.setup.step++;render();},
  su_back:()=>{V.setup.step--;render();},
  su_del:(arg)=>{const[di,si]=arg.split(':').map(Number);
    if(V.setup.days[di].slots.length>1)V.setup.days[di].slots.splice(si,1);render();},
  su_add:di=>{di=+di;const m=$('#addm_'+di).value;
    const ex=EXS.find(e=>e.m===m);
    V.setup.days[di].slots.push([m,ex.id]);render();},
  su_create:()=>{
    const tplC=V.setup.preset&&V.setup.preset.startsWith('tpl:')?RPT.find(x=>x.key===V.setup.preset.slice(4)):null;
    S.meso=createMeso({daysKey:V.setup.daysKey,weeks:V.setup.weeks,
      preset:V.setup.preset,prios:V.setup.prios,prioMap:V.setup.prioMap,days:V.setup.days,carried:V.setup.carried,
      splitName:tplC?tplC.name:null});
    S.draft=null;save();V.setup=null;V.screen='home';render();toast('Mesocycle created');},
  start_workout:beginWorkout,
  skip_day:()=>{if(confirm('Skip this day? Its plan rolls to next week unchanged.'))skipDay();},
  flex_start:i=>{const M=S.meso;
    // abandon a different day's half-done draft only with consent
    if(S.draft&&!(S.draft.w===M.cursor.w&&S.draft.d===+i)
      &&!confirm('You have another workout in progress — discard it and start this one?'))return;
    if(S.draft&&!(S.draft.w===M.cursor.w&&S.draft.d===+i))S.draft=null;
    M.cursor.d=+i;save();beginWorkout();},
  flex_toggle:()=>{const M=S.meso;
    if(M.flex){ // back to fixed: resume at first not-yet-done day this week
      const undone=flexUndone();M.cursor.d=undone.length?undone[0]:0;M.flex=false;
      toast('Fixed weekly order');
    }else{
      M.flex=true;M.flexDone=M.flexDone||{};
      for(let i=0;i<M.cursor.d;i++)M.flexDone[i]=1; // days already done this week count
      toast('Flexible scheduling on');
    }
    save();render();},
  chk:arg=>{const[si,xi]=arg.split(':').map(Number);
    const x=S.draft.sets[si][xi];
    if(!x.done){
      // empty boxes = "the suggestion was right": adopt placeholder values on ✓
      const tt=nextTarget(S.draft.ex[si],S.draft.w,xi);
      if(!String(x.w||'').trim()&&tt&&tt.w>0)x.w=String(tt.w);
      if(!String(x.r||'').trim()&&tt&&tt.reps)x.r=String(tt.reps);
      // sanity-check before logging — protect the algorithm from typos
      const err=setInputError(S.draft.ex[si],+x.w,+x.r);
      if(err){toast(err,true);return;}
      const lp=S.lastPerf[S.draft.ex[si]],kg=isKg();
      if(lp&&lp.w>=(kg?10:20)&&+x.w>=3*lp.w
        &&!confirm(x.w+' '+(kg?'kg':'lb')+' is way above your last '+lp.w+' on this lift — log it anyway?'))return;
    }
    x.done=!x.done;save();
    if(x.done){const ex=EX[S.draft.ex[si]];
      startTimer(ex&&ex.big?S.settings.restBig:S.settings.restSmall);}
    refreshWorkout(si);
    if(x.done){const b=document.querySelector('[data-a="chk:'+si+':'+xi+'"]');if(b&&b.classList)b.classList.add('pop');}},
  addset:si=>{si=+si;const rows=S.draft.sets[si];
    const last=rows[rows.length-1];
    rows.push({w:last?last.w:'',r:'',done:false});save();refreshWorkout(si);},
  rmset:si=>{si=+si;const rows=S.draft.sets[si];
    for(let i=rows.length-1;i>=0;i--)if(!rows[i].done){rows.splice(i,1);break;}
    save();refreshWorkout(si);},
  finish:finishWorkout,
  fbov:v=>{V.fb.overall=v;render();},
  fbmus:arg=>{const[m,dir]=arg.split(':');
    V.fb.mus[m]=V.fb.mus[m]===dir?undefined:dir;render();},
  fbsave:()=>{if(!V.fb.overall)return;
    S.meso.painFlags=S.meso.painFlags||{};
    // a flag is "this hurt last time": trained again today with no pain -> cleared
    [...new Set(Object.values(S.draft.ex))].forEach(id=>{if(!V.fb.pain.includes(id))delete S.meso.painFlags[id];});
    V.fb.pain.forEach(id=>S.meso.painFlags[id]=today());
    completeDay({overall:V.fb.overall,mus:V.fb.mus});},
  fbpain:id=>{const i=V.fb.pain.indexOf(id);
    if(i>=0)V.fb.pain.splice(i,1);else V.fb.pain.push(id);render();},
  timer_x:()=>{stopTimer();},
  timer_plus:()=>{clearTimeout(tHide);
    V.timerEnd=Math.max(Date.now(),V.timerEnd||0)+30000;
    V.timerTotal=(V.timerTotal||0)+30;
    $('#timerbar').style.display='flex';
    clearInterval(tInt);tInt=setInterval(tickTimer,250);tickTimer();},
  planw:x=>{V.planWeek=+x;render();},
  bw_add:()=>{const v=parseFloat($('#bwin').value);
    if(!v){toast('Enter a weight first');return;}
    if(v<(isKg()?25:55)||v>(isKg()?320:700)){toast('That bodyweight looks off — double-check it',true);return;}
    const last=S.bw[S.bw.length-1];
    if(last&&last.d===today())last.v=v;else S.bw.push({d:today(),v});   // one reading per day
    save();render();toast('Bodyweight logged');},
  units:u=>{
    if(u===unit())return;
    const hasData=Object.keys(S.lastPerf).length||S.bw.length;
    if(hasData&&!confirm('Switch to '+u+'? Your logged weights, bodyweight and targets will be converted.'))return;
    convertUnits(u);save();render();toast('Now in '+u);},
  export:async()=>{
    const name='hypercoach-backup-'+today()+'.json';
    const json=JSON.stringify(S,null,1);
    const done=()=>{S.workoutsSinceBackup=0;S.lastBackup=today();save();render();};
    // iOS/Android: share sheet -> Files app, iCloud Drive, or the Google Drive app
    try{
      const file=new File([json],name,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:'HYPERCOACH backup'});
        done();toast('Backed up — pick Files or Drive to store it');return;
      }
    }catch(e){if(e&&e.name==='AbortError')return;} // user closed the sheet: not backed up
    const blob=new Blob([json],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download=name;a.click();
    done();toast('Backup downloaded');},
  end_early:()=>{if(confirm('Jump straight to the deload week?')){
    S.meso.cursor={w:S.meso.weeks,d:0};S.meso.flexDone={};S.meso.downStreak=0;
    S.draft=null;save();V.screen='home';render();}},
  reset:()=>{if(!V.confirmReset){V.confirmReset=true;render();return;}
    localStorage.removeItem(LS);adopt(defaults());V.pf=newPf();V.screen='profile';V.confirmReset=false;render();},
  new_meso:()=>{const old=S.meso;S.archive.push(old);S.meso=null;S.draft=null;save();
    V.setup=newSetup(old);V.screen='setup';render();},
  switch_meso:()=>{
    if(S.draft&&!confirm('You have a workout in progress — switching discards it. Continue?'))return;
    if(!S.draft&&!confirm('Start a different program? This block is saved under Past mesocycles and can be resumed anytime.'))return;
    A.new_meso();},
  meso_resume:i=>{i=+i;
    const target=S.archive[i];if(!target)return;
    if(S.draft&&!confirm('You have a workout in progress — switching discards it. Continue?'))return;
    S.archive.splice(i,1);
    if(S.meso)S.archive.push(S.meso);                    // current block goes to the shelf
    S.meso=target;S.draft=null;save();
    V.screen='home';render();
    toast('Back on '+target.splitName+' — week '+target.cursor.w);},
  pfset:arg=>{const i=arg.indexOf(':');V.pf[arg.slice(0,i)]=arg.slice(i+1);render();},
  pf_save:()=>{const f=V.pf;
    const htVal=f.units==='kg'?+f.ht:(+f.htFt*12+(+f.htIn||0));
    if(!f.name||!(+f.age)||!(+f.bw)||!(htVal>0)){toast('Fill in name, age, height & bodyweight');return;}
    S.profile={name:f.name.trim(),age:+f.age,sex:f.sex,bw:+f.bw,ht:htVal,units:f.units,
      exp:f.exp,goal:f.goal,activity:f.activity,meals:+f.meals||4};
    S.settings.units=f.units;
    const last=S.bw[S.bw.length-1];
    if(!last||last.d!==today())S.bw.push({d:today(),v:+f.bw});
    save();V.screen=S.meso?'home':'welcome';render();toast('Profile saved');},
  pf_edit:()=>{V.pf=S.profile?{...S.profile}:newPf();
    if(V.pf.units!=='kg'&&+V.pf.ht){V.pf.htFt=String(Math.floor(V.pf.ht/12));V.pf.htIn=String(Math.round(V.pf.ht%12));}
    V.screen='profile';render();},
  dgoal:g=>{S.profile.goal=g;save();render();},
  dmeals:n=>{S.profile.meals=+n;if(S.dietPrefs)S.dietPrefs.meals=+n;save();render();},
  libm:m=>{V.libm=m;render();},
  fav:id=>{S.favs=S.favs||[];const i=S.favs.indexOf(id);
    if(i>=0){S.favs.splice(i,1);toast('Removed from favorites');}
    else{S.favs.push(id);toast('⭐ Favorited — it\'ll show up first in menus and future programs');}
    save();render();},
  dpset:arg=>{const i=arg.indexOf(':');V.dp[arg.slice(0,i)]=arg.slice(i+1);render();},
  dp_save:()=>{S.dietPrefs={meals:(S.profile&&S.profile.meals)||4,train:V.dp.train,window:V.dp.window,
      style:V.dp.style||'std',avoid:(V.dp.avoid||[]).slice()};
    S.mealSel={};save();render();toast('Meal plan ready');},
  dp_edit:()=>{V.dp={train:S.dietPrefs.train,window:S.dietPrefs.window,style:S.dietPrefs.style||'std',
      avoid:(S.dietPrefs.avoid||[]).slice()};S.dietPrefs=null;saveQuiet();render();},
  dpavoid:k=>{V.dp.avoid=V.dp.avoid||[];const i=V.dp.avoid.indexOf(k);
    if(i>=0)V.dp.avoid.splice(i,1);else{V.dp.avoid.push(k);
      if(k==='veg')V.dp.avoid=V.dp.avoid.filter(x=>x!=='pesc');
      if(k==='pesc')V.dp.avoid=V.dp.avoid.filter(x=>x!=='veg');}
    render();},
  mp_swap:i=>{S.mealSel=S.mealSel||{};S.mealSel[i]=((S.mealSel[i]||0)+1);save();render();},
  shop_share:async()=>{
    const sh=shoppingList();if(!sh)return;
    let txt='HYPERCOACH shopping list (1 week)\n';
    Object.keys(MEAL_CATS).filter(c=>sh[c]).forEach(c=>{
      txt+='\n'+MEAL_CATS[c]+':\n'+sh[c].map(x=>'- '+scaleQty(x.qty,1)+(x.unit?' '+x.unit:'')+' '+x.name).join('\n')+'\n';});
    try{if(navigator.share){await navigator.share({text:txt,title:'Shopping list'});return;}}catch(e){}
    try{await navigator.clipboard.writeText(txt);toast('Copied to clipboard');}
    catch(e){toast('Could not copy');}},
  automatch:()=>{S.settings.autoMatch=S.settings.autoMatch===false?true:false;save();render();},
  drive_sync:async()=>{
    if(driveToken()){toast('Backing up…');await drivePush();
      const ok=S.drive.lastSync&&Date.now()-S.drive.lastSync<60e3;
      toast(ok?'Backed up ☁️':'Backup failed: '+(S.drive.lastErr||'unknown error'),!ok);render();}
    else A.drive_connect();},
  drive_connect:()=>{
    if(isStandalone()){rlog('Opening Google sign-in…');driveRedirectAuth();return;}
    if(!gClient){toast('Google sync not configured yet');return;}
    try{gClient.requestAccessToken({prompt:S.drive&&S.drive.connected?'':'consent'});}
    catch(e){toast('Could not open Google sign-in');}},
  drive_off:()=>{
    try{if(gTok&&window.google)google.accounts.oauth2.revoke(gTok);}catch(e){}
    gTok=null;S.drive=null;V.driveNeeds=false;saveQuiet();render();toast('Google Drive disconnected');},
  pick:si=>{V.pick={slot:si==='add'?'add':+si};V.libq='';V.screen='library';render();},
  pick_cancel:()=>{V.pick=null;V.libq='';V.screen='workout';render();},
  pickex:id=>{
    if(!V.pick||!S.draft)return;
    if(V.pick.slot==='add'){ // append a brand-new exercise to today's day
      const M=S.meso,d=S.draft.d,w=S.draft.w,m=EX[id].m;
      if(!MUSCLES[m]){toast('That one is reference-only — pick a lift from a main muscle group',true);return;}
      M.days[d].slots.push({m,ex:id});
      const si=M.days[d].slots.length-1;
      // every stored week plan for this day gains the new slot (2 sets, inside the 3-cap)
      Object.keys(M.plan).forEach(k=>{if(k.endsWith('_'+d))M.plan[k].push(2);});
      S.draft.ex[si]=id;
      S.draft.sets[si]=Array.from({length:w>=M.weeks?1:2},()=>({w:'',r:'',done:false}));
      save();V.pick=null;V.libq='';V.screen='workout';render();
      toast('Added '+EX[id].name+' — it\'s part of this day now');return;
    }
    const si=V.pick.slot;
    S.draft.ex[si]=id;
    S.meso.days[S.draft.d].slots[si].ex=id; // permanent for the rest of the meso
    (S.draft.sets[si]||[]).forEach(x=>{if(!x.done)x.w='';}); // new lift's suggestion shows as placeholder
    save();V.pick=null;V.libq='';V.screen='workout';render();
    toast('Swapped to '+EX[id].name+' for the rest of this meso');},
  rmex:si=>{si=+si;
    const M=S.meso,d=S.draft.d;
    if((S.draft.sets[si]||[]).some(x=>x.done)){
      toast('It has logged sets today — uncheck them first if you really want it gone',true);return;}
    if(M.days[d].slots.length<=1){toast('A workout needs at least one exercise',true);return;}
    if(!confirm('Remove '+EX[S.draft.ex[si]].name+' from this day for the rest of the meso?'))return;
    M.days[d].slots.splice(si,1);
    Object.keys(M.plan).forEach(k=>{if(k.endsWith('_'+d))M.plan[k].splice(si,1);});
    const ex={},sets={};let j=0; // draft maps are index-keyed: reindex past the gap
    Object.keys(S.draft.ex).map(Number).sort((a,b)=>a-b).forEach(i=>{
      if(i===si)return;ex[j]=S.draft.ex[i];sets[j]=S.draft.sets[i];j++;});
    S.draft.ex=ex;S.draft.sets=sets;
    save();render();toast('Removed from this day');},
  su_rec:()=>{const r=V._rec||recProgram(S.profile);
    if(r.tpl)A.su_tpl(r.tpl);else A.su_preset(r.preset);},
  su_tpl:k=>{
    const t=RPT.find(x=>x.key===k);if(!t)return;
    V.setup.daysKey=t.days.length;V.setup.preset='tpl:'+k;V.setup.carried=false;
    V.setup.days=t.days.map(d=>({name:d.name,slots:d.ex.filter(id=>EX[id]&&MUSCLES[EX[id].m]).map(id=>[EX[id].m,id])}));
    render();},
};

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const i=t.dataset.a.indexOf(':');
  const a=i<0?t.dataset.a:t.dataset.a.slice(0,i);
  const arg=i<0?undefined:t.dataset.a.slice(i+1);
  if(A[a])A[a](arg,t);
});
document.addEventListener('change',e=>{
  const t=e.target.closest('[data-ch]');
  if(t){
    const[c,...rest]=t.dataset.ch.split(':');
    if(c==='su_ex'){const[di,si]=rest.map(Number);V.setup.days[di].slots[si][1]=t.value;}
    if(c==='wx'){const si=+rest[0];S.draft.ex[si]=t.value;
      const sg=suggest(t.value,S.draft.w);
      S.draft.sets[si].forEach(x=>{if(!x.done)x.w=sg?String(sg.w):'';});
      save();render();}
    if(c==='progex'){V.progEx=t.value;render();}
    return;
  }
  if(e.target.id==='importfile'&&e.target.files[0]){
    const fr=new FileReader();
    fr.onload=()=>{try{const x=JSON.parse(fr.result);
      if(!x.v)throw 0;adopt(x);save();V.screen=S.profile?'home':'profile';render();toast('Backup restored');}
      catch(err){toast('Invalid backup file');}};
    fr.readAsText(e.target.files[0]);
  }
});
document.addEventListener('input',e=>{
  const t=e.target.closest('[data-in]');if(!t)return;
  const p=t.dataset.in.split(':');
  if(p[0]==='w'||p[0]==='r'){S.draft.sets[+p[1]][+p[2]][p[0]]=t.value;save();}
  else if(p[0]==='restBig'||p[0]==='restSmall'){S.settings[p[0]]=+t.value||90;save();}
  else if(p[0]==='pf'){V.pf[p[1]]=t.value;}
  else if(p[0]==='libq'){V.libq=t.value;render();
    const el=document.querySelector('[data-in="libq"]');
    if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length);}catch(err){}}}
});
document.addEventListener('focusout',e=>{ // refresh placement preview after typing
  const t=e.target.closest&&e.target.closest('[data-in^="pf:"]');
  if(t&&V.screen==='profile')render();
});
document.addEventListener('focusin',e=>{ // remember pre-edit weight for auto-match
  const t=e.target.closest&&e.target.closest('[data-in^="w:"]');
  if(t)V._wOld=t.value;
});
document.addEventListener('change',e=>{ // auto-match: apply new weight to later matching sets
  const t=e.target.closest&&e.target.closest('[data-in^="w:"]');
  if(!t||!S.draft||S.settings.autoMatch===false)return;
  const[,si,xi]=t.dataset.in.split(':').map(Number);
  const nv=t.value,ov=V._wOld;
  if(nv===ov)return;
  let changed=0;
  (S.draft.sets[si]||[]).forEach((x,i)=>{
    if(i>xi&&!x.done&&(x.w===ov||x.w==='')){x.w=nv;changed++;}
  });
  if(changed){save();
    // fill the later inputs in place — no re-render, so the field you just
    // tapped into keeps focus and the keyboard stays up
    (S.draft.sets[si]||[]).forEach((x,i)=>{
      if(i>xi&&!x.done){const el=document.querySelector('[data-in="w:'+si+':'+i+'"]');
        if(el)el.value=x.w;}
    });
  }
});

/* resume mid-workout after reload */
try{history.scrollRestoration='manual';}catch(e){} // we place the scroll ourselves
if(S.profile&&S.draft&&S.meso&&!S.meso.done)V.screen='workout';
const cameBackWithToken=driveHashToken(); // returning from redirect sign-in?
render();
scrollToNextSet(); // reload mid-workout lands on the set that's next
driveInit();
if(cameBackWithToken){toast('Google connected ☁️');driveBootSync();}
</script>
</body>
