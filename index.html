<!doctype html>
<html lang="en">
<head>

<body>
<style>
  :root{
    --bg:#0b0b0d; --card:#151518; --card2:#202024; --line:#26262b;
    --ink:#f4f4f5; --mut:#a1a1aa; --dim:#71717a;
    --red:#d92c2c; --red-soft:#38191b;
    --grn:#4fb477; --grn-soft:#1e3328;
    --amb:#d9942b; --amb-soft:#37301c;
    --blu:#6aa3d9;
    --r:18px; --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{font-size:16px;-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    line-height:1.45;padding-bottom:calc(96px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  #app{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 0}
  h1{font-size:1.7rem;font-weight:800;letter-spacing:-.025em;line-height:1.15}
  h2{font-size:1.06rem;font-weight:700;letter-spacing:-.012em;line-height:1.25}
  .lbl{font-size:.68rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
  .mut{color:var(--mut)} .dim{color:var(--dim)} .sm{font-size:.85rem} .xs{font-size:.75rem}
  .num{font-variant-numeric:tabular-nums}
  .red{color:var(--red)} .grn{color:var(--grn)} .amb{color:var(--amb)} .blu{color:var(--blu)}
  .card{background:linear-gradient(180deg,#17171b 0%,#141417 100%);border:1px solid var(--line);
    border-radius:var(--r);padding:16px;margin-bottom:12px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 1px 2px rgba(0,0,0,.35)}
  .card.hero{padding:18px;border-color:rgba(217,44,44,.55);
    background:radial-gradient(120% 90% at 100% 0%,rgba(217,44,44,.13) 0%,rgba(217,44,44,0) 60%),linear-gradient(180deg,#18181c,#141417)}
  .card.hero.dl{border-color:rgba(106,163,217,.5);
    background:radial-gradient(120% 90% at 100% 0%,rgba(106,163,217,.12) 0%,rgba(106,163,217,0) 60%),linear-gradient(180deg,#18181c,#141417)}
  .card.good{border-color:rgba(79,180,119,.5);
    background:radial-gradient(120% 90% at 100% 0%,rgba(79,180,119,.12) 0%,rgba(79,180,119,0) 60%),linear-gradient(180deg,#18181c,#141417)}
  .card.xdone{border-color:rgba(79,180,119,.32)}
  .row{display:flex;align-items:center;gap:10px}
  .between{justify-content:space-between}
  .wrap{flex-wrap:wrap}
  .col{display:flex;flex-direction:column;gap:10px}
  .btn{display:block;width:100%;border:none;border-radius:14px;padding:15px;font-size:1.02rem;
    font-weight:700;font-family:inherit;cursor:pointer;text-align:center;color:var(--ink);background:var(--card2);
    transition:transform .12s var(--ease),opacity .15s,background .15s}
  .btn:active{transform:scale(.975)}
  .btn.primary{background:linear-gradient(180deg,#e23434 0%,#cc2626 100%);color:#fff;border-radius:999px;
    box-shadow:0 6px 18px rgba(217,44,44,.28),inset 0 1px 0 rgba(255,255,255,.16)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--mut)}
  .btn.small{width:auto;padding:9px 14px;font-size:.85rem;border-radius:99px}
  .btn.small.primary{box-shadow:0 3px 10px rgba(217,44,44,.25),inset 0 1px 0 rgba(255,255,255,.16)}
  .btn:disabled{opacity:.35;pointer-events:none;box-shadow:none}
  .btn.danger{background:var(--red-soft);color:var(--red)}
  a.btn{text-decoration:none;line-height:1.2}
  .ibtn{width:38px;height:38px;flex:0 0 38px;display:inline-flex;align-items:center;justify-content:center;

  .ibtn:active{transform:scale(.92);background:var(--card2)}
  .ibtn.play{color:var(--red);border-color:rgba(217,44,44,.4)}

  .chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:8px;

  .mdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:2px;flex:0 0 auto}
  .wkprog{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin:0 2px 14px}

  .chip.amb{background:var(--amb-soft);color:var(--amb)}
  .chip.stretch{background:#16303f;color:var(--blu)}
  .cue{display:flex;gap:8px;align-items:flex-start;font-size:.8rem;color:var(--mut);
    background:rgba(255,255,255,.035);border-radius:12px;padding:9px 11px;margin:7px 0 2px;line-height:1.4}
  .cue .st{flex:0 0 auto;font-size:.9rem;line-height:1.2}
  .cue.tgt{background:rgba(79,180,119,.07);border:1px solid rgba(79,180,119,.16)}
  .cue.tgt.warn{background:rgba(217,148,43,.07);border-color:rgba(217,148,43,.3)}
  .sci-src{font-size:.72rem;color:var(--blu);text-decoration:none;word-break:break-word}

    background:var(--card);color:var(--mut);font-size:.85rem;font-weight:600;text-align:center;cursor:pointer;font-family:inherit;
    transition:background .15s,color .15s,border-color .15s,transform .12s var(--ease)}

  input.in,select.sel{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;
    color:var(--ink);font-size:1rem;font-family:inherit;padding:12px;outline:none;

  input.in:focus,select.sel:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(217,44,44,.16)}

  .chk.on{background:var(--grn-soft);border-color:var(--grn);color:var(--grn)}

  .vol .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--dim);opacity:.7;border-radius:2px}
  .weekchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
  .weekchips::-webkit-scrollbar{display:none}
  .weekchips .wc{flex:0 0 auto;padding:8px 14px;border-radius:99px;border:1px solid var(--line);
    background:var(--card);color:var(--mut);font-weight:700;font-size:.82rem;cursor:pointer;font-family:inherit}
  .weekchips .wc.on{background:#d8d8dc;border-color:#d8d8dc;color:#131316}
  .slotline{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:8px}
  .slotline:last-child{border-bottom:none}
  .fbq{margin-bottom:18px}
  .fbq .seg .opt{min-width:0;flex:1 1 40%;padding:13px 6px}
  svg.chart{width:100%;height:auto;display:block}
  details{border-bottom:1px solid var(--line);padding:11px 0}
  details:last-child{border-bottom:none}
  summary{font-weight:700;cursor:pointer;font-size:.92rem;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px}
  summary::-webkit-details-marker{display:none}
  summary::after{content:'';flex:0 0 auto;width:7px;height:7px;border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);
    transform:rotate(45deg);transition:transform .2s var(--ease);margin:0 4px 3px 0}
  details[open]>summary::after{transform:rotate(-135deg);margin-bottom:-3px}
  details p{margin-top:8px;font-size:.88rem;color:var(--mut)}
  .hdr{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 16px}
  .brand{font-weight:850;letter-spacing:-.01em;font-size:1.08rem}
  .brand span{color:var(--red)}
  .bignum{font-size:2rem;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:8px}
  .stat{background:rgba(255,255,255,.04);border-radius:13px;padding:10px 6px;text-align:center}
  .stat b{display:block;font-size:1.25rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .stat span{font-size:.68rem;color:var(--mut);font-weight:600}
  .toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-8px);background:rgba(30,51,40,.97);
    border:1px solid var(--grn);color:var(--grn);padding:10px 18px;border-radius:99px;font-weight:700;
    font-size:.88rem;z-index:60;opacity:0;transition:opacity .22s,transform .22s var(--ease);pointer-events:none;
    max-width:92vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.45)}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.err{background:rgba(56,25,27,.97);border-color:var(--red);color:#f0595a}
  #app.enter>*:not(.tabs){animation:fadeUp .24s var(--ease) both}
  @keyframes fadeUp{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app"></div>
<div id="about" style="max-width:520px;margin:18px auto 0;padding:0 16px;font-size:.75rem;color:#71717a;line-height:1.5;text-align:center">
  <b style="color:#a1a1aa">HyperCoach</b> is a free personal strength-training log and planner. It builds a weekly
  lifting program, records the sets you do, and sets your next targets. Your data stays on your device; if you
  choose to connect Google Drive, the app keeps one backup file in your own Drive.<br>
  <a href="privacy.html" style="color:#6aa3d9">Privacy Policy</a>
</div>
<div id="timerbar"><div style="display:flex;align-items:center;gap:14px"><div><div class="lbl">Rest</div><div class="tt" id="tt">0:00</div></div>
  <button class="btn small ghost" data-a="timer_plus">+30s</button></div>
  <button class="btn small ghost" data-a="timer_x">Skip</button><div class="bar" id="tbar"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ============================================================
   Hypertrophy Coach — mesocycle training
   Methodology: published volume-landmark research (MV/MEV/MAV/MRV),
   RIR-based effort progression, set autoregulation from
   soreness/pump/workload feedback, deload week.
   ============================================================ */

const LS='hypercoach2_v1';

/* ---------- Volume landmarks (sets/muscle/week) ----------
   start = conservative MEV where each meso begins.           */
const MUSCLES={
  chest:      {name:'Chest',      mv:4, start:6, mav:14, mrv:22, rec:48},
  back:       {name:'Back',       mv:6, start:8, mav:16, mrv:25, rec:48},
  delts:      {name:'Shoulders',  mv:4, start:6, mav:16, mrv:26, rec:36},
  rear_delts: {name:'Rear Delts', mv:0, start:4, mav:12, mrv:22, rec:24},
  biceps:     {name:'Biceps',     mv:4, start:6, mav:14, mrv:26, rec:36},
  triceps:    {name:'Triceps',    mv:4, start:5, mav:12, mrv:18, rec:48},
  quads:      {name:'Quads',      mv:4, start:6, mav:14, mrv:20, rec:72},
  hams:       {name:'Hamstrings', mv:3, start:4, mav:12, mrv:20, rec:72},
  glutes:     {name:'Glutes',     mv:0, start:4, mav:10, mrv:16, rec:48},
  calves:     {name:'Calves',     mv:4, start:6, mav:14, mrv:20, rec:36},
  abs:        {name:'Abs',        mv:0, start:4, mav:16, mrv:25, rec:24},
};
/* rec = baseline hours until the muscle is ready to be trained hard again,
   from the recovery literature: damage + soreness resolve in ~1 day for small,
   fast-recovering muscles (abs, rear delts), ~1.5-2 days for most upper-body
   muscles, and ~3 days for the big lower-body movers (quads, hamstrings) where
   long-length loading (squats, RDLs) causes the most disruption. The timer
   scales with how much you actually did: a big session (8+ sets on a muscle)
   needs ~25% longer; a light touch (≤3 sets) ~25% less. */
function recHours(m,sets){
  const base=(MUSCLES[m]&&MUSCLES[m].rec)||48;
  return Math.round(base*(sets>=8?1.25:sets<=3?0.75:1));
}
function muscleRecovery(m){
  const L=(S.recLog||{})[m];
  if(!L)return null;                       // never logged -> fully ready
  const need=recHours(m,L.sets||4),elapsed=(Date.now()-L.t)/36e5;
  return {need,elapsed,left:Math.max(0,need-elapsed)};
}
function fmtHrs(h){return h>=24?(Math.round(h/12)/2)+'d':Math.ceil(h)+'h';}
function dayReadiness(di){
  const M=S.meso,ms=[...new Set(M.days[di].slots.map(s=>s.m))];
  const blocks=[];
  ms.forEach(m=>{const r=muscleRecovery(m);if(r&&r.left>0.5)blocks.push({m,left:r.left});});
  blocks.sort((a,b)=>b.left-a.left);
  return {ready:!blocks.length,blocks,score:blocks.reduce((a,x)=>a+x.left,0)};
}
function flexUndone(){
  const M=S.meso;
  return M.days.map((_,i)=>i).filter(i=>!(M.flexDone||{})[i]);
}
function recommendDay(){
  const undone=flexUndone();
  if(!undone.length)return 0;
  const scored=undone.map(i=>({i,r:dayReadiness(i)}));
  const ready=scored.filter(x=>x.r.ready);
  if(ready.length)return ready[0].i;       // first fully-recovered day in plan order
  scored.sort((a,b)=>a.r.score-b.r.score); // else the least-blocked one
  return scored[0].i;
}
function weekDoneCount(){
  const M=S.meso;
  return M.flex?Object.keys(M.flexDone||{}).length:M.cursor.d;
}
/* ---------- Synergist credit (fractional volume) ----------
   Pelland et al. 2024 (67 studies): a set counts fully for its prime mover and
   about HALF for the muscles that assist it. A row is 1 back set + ½ a biceps
   set + ½ a rear-delt set. Derived from the lift's name so the whole catalog
   is covered; isolation lifts credit only their own muscle. */
function synergists(ex){
  if(!ex)return [];
  if(ex._syn)return ex._syn;
  const n=ex.name.toLowerCase(),m=ex.m;let s=[];
  if(m==='chest'){if(/press|push-?up|dip|bench/.test(n)&&!/fly/.test(n))s=['triceps'];}
  else if(m==='delts'){if(/press/.test(n))s=['triceps'];}
  else if(m==='triceps'){if(/dip|bench|push-?up/.test(n))s=['chest'];}
  else if(m==='back'){
    if(/pullover|straight-arm|shrug/.test(n))s=[];
    else if(/row/.test(n))s=['biceps','rear_delts'];
    else if(/pull-?up|chin|pulldown/.test(n))s=['biceps'];
    else if(/deadlift/.test(n))s=['glutes','hams'];
  }
  else if(m==='quads'){if(/squat|leg press|lunge|step-?up/.test(n)&&!/sissy/.test(n))s=['glutes'];}
  else if(m==='hams'){if(/deadlift|good morning|back extension|back raise|hyper|glute-?ham/.test(n))s=['glutes'];}
  else if(m==='glutes'){if(/deadlift/.test(n))s=['hams'];else if(/lunge|squat|step-?up/.test(n))s=['quads'];}
  return ex._syn=s;
}
/* Weekly volume for a muscle: direct sets, indirect (synergist) sets, and the
   effective total the dose-response research is actually written in. */
function muscleWeekVol(M,w,m){
  let direct=0,ind=0,freq=0;
  for(let d=0;d<M.daysPerWeek;d++){
    const tg=targetsFor(w,d)||[];let hit=false;
    M.days[d].slots.forEach((s,i)=>{const n=tg[i]||0;
      if(s.m===m){direct+=n;hit=true;}
      else if(synergists(EX[s.ex]).includes(m))ind+=n;});
    if(hit)freq++;
  }
  return {direct,ind,eff:direct+ind/2,freq};
}

/* Per-muscle accent colors: pull = blues, push = pinks/magentas,
   legs = greens, abs = purple, calves = teal. */
const MCOLOR={chest:'#ec4899',delts:'#f472b6',rear_delts:'#fb7185',triceps:'#e879a9',
  back:'#38bdf8',biceps:'#818cf8',quads:'#10b981',hams:'#34d399',glutes:'#22c55e',
  calves:'#2dd4bf',abs:'#a78bfa'};
function mdot(m){const c=MCOLOR[m];return c?`<span class="mdot" style="background:${c}"></span>`:'';}
function mtint(m){const c=MCOLOR[m];return c?`style="color:${c}"`:'';}

/* ---------- Profile placement ----------
   Questionnaire -> program adjustments. Experience and age scale the volume
   landmarks, cap how close to failure you train, and bias rep ranges. */
function placement(p){
  if(!p)return {scale:1,rirCap:0,repHigh:false,daysRec:4,label:'Standard',notes:[]};
  let scale=1,rirCap=0,repHigh=false,daysRec=4;const notes=[];
  if(+p.ht&&+p.bw){ // body size: long ROMs & big mass = fewer recoverable sets
    const cm=p.units==='kg'?+p.ht:+p.ht*2.54, kg=p.units==='kg'?+p.bw:+p.bw/2.20462;
    const bmi=kg/Math.pow(cm/100,2);
    if(bmi>=30){scale*=0.9;notes.push('Bigger lifters pay more recovery per set — volume ceiling trimmed ~10%');}
    else if(cm>=188){scale*=0.93;notes.push('Long levers = long ranges of motion — volume ceiling trimmed slightly');}
  }
  if(p.sex==='f'){scale*=1.05;daysRec=5;
    notes.push('Women recover faster between sets and sessions and tolerate a bit more volume & frequency');}
  if(p.exp==='mid')  {scale*=0.9;rirCap=1;daysRec=Math.min(daysRec,4);}
  if(p.exp==='new'){scale*=0.75;rirCap=2;daysRec=3; // beginners: 2-3 full-body sessions
    notes.push('Technique first — beginners grow fine 2+ reps from failure, and they badly underestimate true failure');}
  if(+p.age>=55){scale*=0.7;rirCap=Math.max(rirCap,2);repHigh=true;daysRec=3;
    notes.push('Joint-friendly: higher reps, longer warm-ups, more recovery between hard weeks');}
  else if(+p.age>=40){scale*=0.85;rirCap=Math.max(rirCap,1);daysRec=Math.min(daysRec,4);
    notes.push('Volume ceiling trimmed ~15% and a small effort cap — recovery is the limiter after 40');}
  const label=+p.age>=55?'Longevity':p.exp==='new'?'Foundation':p.exp==='mid'?'Builder':'Advanced';
  return {scale,rirCap,repHigh,daysRec,label,notes};
}
/* Questionnaire -> recommended program. The default is always the app's own
   coverage-checked split (every muscle trained, majors 2×/week) at the
   lifter's recommended frequency; new and 55+ lifters get the all-machine
   version (simplest to learn, safest to load). The ready-made templates stay
   one tap away, but several of them skip whole muscle groups, so none is the
   automatic pick — sex and age alone don't decide what someone wants to grow. */
function recProgram(p){
  if(!p)return {preset:'balanced'};
  const age=+p.age||35;
  if(p.exp==='new'||age>=55)return {preset:'machines'};
  return {preset:'balanced'};
}
function LM(m){ // volume landmarks scaled to profile + diet phase (HMSIT ch. on modifiers)
  const p=S&&S.profile,L=MUSCLES[m],s=placement(p).scale;
  const goal=p&&p.goal;
  let start=Math.max(2,Math.round(L.start*s)),mav=Math.max(4,Math.round(L.mav*s)),
      mrv=Math.max(5,Math.round(L.mrv*s));
  if(goal==='cut'){mrv=Math.max(start+2,Math.round(mrv*0.88));} // deficit shrinks the window
  else if(goal==='gain'){mrv=Math.round(mrv*1.08);}             // surplus widens it a bit
  return {name:L.name,mv:L.mv,start,mav:Math.min(mav,mrv-1),mrv,
    // veterans of a prior block restart midway to MAV, not back at MEV
    restart:S&&S.archive&&S.archive.length?Math.min(Math.round((start+mav)/2),mrv-2):start};
}
function repRange(ex){ // beginners & older lifters live in the top half of each range
  return placement(S&&S.profile).repHigh
    ?{lo:Math.min(ex.hi-3,Math.round((ex.lo+ex.hi)/2)),hi:ex.hi}
    :{lo:ex.lo,hi:ex.hi};
}

/* ---------- Diet engine (evidence-based) ----------
   Maintenance = blend of training-day and rest-day needs (book's worked
   examples: ~14.5-16 kcal/lb training days, ~11.5-12 rest days).
   Rates: gain 0.25-0.5% BW/wk (mid 0.35), cut 0.5-1% (mid 0.7). */
const DIET={trainDay:{low:14,med:14.5,high:15.5},restDay:{low:11.5,med:12,high:13},
  gainPct:0.0035,cutPct:0.007,
  proteinGain:1.0,proteinCut:1.1,fatMinPerLb:0.3,fatPctCals:0.25};
function dietCalc(p){
  if(!p||!(+p.bw))return null;
  const bwLb=p.units==='kg'?p.bw*2.20462:+p.bw;
  const act=p.activity||'med';
  const tdays=S.meso?S.meso.daysPerWeek:(placement(p).daysRec||4);
  let maint;
  if(+p.ht){ // Mifflin-St Jeor from height/weight/age/sex, scaled by activity + training days
    const kg=p.units==='kg'?+p.bw:+p.bw/2.20462, cm=p.units==='kg'?+p.ht:+p.ht*2.54;
    const bmr=10*kg+6.25*cm-5*(+p.age||35)+(p.sex==='f'?-161:5);
    const mult=({low:1.35,med:1.5,high:1.65}[act]||1.5)+0.02*tdays;
    maint=Math.round(bmr*mult/10)*10;
  }else{
    maint=Math.round(bwLb*(DIET.trainDay[act]*tdays+DIET.restDay[act]*(7-tdays))/7/10)*10;
  }
  const goal=p.goal||'maintain';
  let delta=goal==='gain'?Math.round(bwLb*DIET.gainPct*3500/7)
    :goal==='cut'?-Math.round(bwLb*DIET.cutPct*3500/7):0;
  let cals=Math.round((maint+delta)/10)*10;
  // Safety floor: never prescribe an intake below what's sustainable without
  // medical supervision (1,200 kcal women / 1,500 men). A small person on a
  // percentage-based cut would otherwise land near 1,100.
  const floorCals=p.sex==='f'?1200:1500;
  let floored=false;
  if(goal==='cut'&&cals<floorCals){cals=floorCals;delta=cals-maint;floored=true;}
  // Protein scales with lean mass, not total mass: for higher body-fat
  // levels, bodyweight-based targets balloon (350 g for a 320-lb lifter).
  // ~1 g per cm of height tracks lean mass and equals ~1 g/lb at a normal
  // build, so it only bites where bodyweight overshoots.
  const cmH=+p.ht?(p.units==='kg'?+p.ht:+p.ht*2.54):0;
  const pBasis=cmH?Math.min(bwLb,cmH*1.05):bwLb;
  const protein=Math.round(pBasis*(goal==='cut'?DIET.proteinCut:DIET.proteinGain));
  const fat=Math.max(Math.round(pBasis*DIET.fatMinPerLb),Math.round(cals*DIET.fatPctCals/9));
  const carbs=Math.max(0,Math.round((cals-protein*4-fat*9)/4));
  const wkRate=goal==='maintain'?0:+(delta*7/3500).toFixed(1);
  return {bwLb,maint,cals,delta,protein,fat,carbs,goal,wkRate,tdays,floored};
}
function bwTrend(){ // weekly rate from the bodyweight log (needs steady logging)
  const b=S.bw;if(b.length<6)return null;
  const now=new Date(b[b.length-1].d).getTime();
  const inWin=(e,a,z)=>{const t=new Date(e.d).getTime();return t<=now-a*864e5&&t>now-z*864e5;};
  const cur=b.filter(e=>inWin(e,-1,7)),prev=b.filter(e=>inWin(e,7,14));
  if(cur.length<3||prev.length<3)return null;
  const avg=x=>x.reduce((a,e)=>a+e.v,0)/x.length;
  return +(avg(cur)-avg(prev)).toFixed(1);
}

function groupName(m){return MUSCLES[m]?MUSCLES[m].name:(LIB_GROUPS[m]||m);}
function equipOf(name){ // equipment tag for the curated in-app exercises
  if(/Machine|Pec Deck|Leg Press|Hack|Leg Ext|Abduction|Pulldown|High Row/i.test(name))return 'Machine';
  if(/Cable|Pushdown|Face Pull|Rope/i.test(name))return 'Cable';
  if(/DB|Dumbbell|Goblet/i.test(name))return 'Dumbbell';
  if(/Barbell|Smith|EZ-Bar|Skullcrusher/i.test(name))return 'Barbell';
  if(/Assisted/i.test(name))return 'Machine Assistance';
  if(/Push-Up|Hanging|Ab Wheel|Crunch|Back Extension|Raise \(45/i.test(name))return 'Bodyweight';
  return 'Machine';
}

/* Any state entering the app — this phone's storage, a backup file, a Drive
   restore, a copy written by an older build — gets every field the current
   code expects, so a missing key can never crash a screen. */
function normalize(x){
  const d=defaults();
  Object.keys(d).forEach(k=>{if(x[k]===undefined||x[k]===null&&k!=='profile'&&k!=='meso'&&k!=='draft')x[k]=d[k];});
  x.settings=Object.assign({},d.settings,x.settings||{});
  if(!Array.isArray(x.archive))x.archive=[];
  if(!Array.isArray(x.bw))x.bw=[];
  if(!Array.isArray(x.favs))x.favs=[];
  if(!x.lastPerf||typeof x.lastPerf!=='object')x.lastPerf={};
  x.archive=x.archive.filter(m=>m&&m.days&&m.log&&m.cursor);
  if(x.meso&&!(x.meso.days&&x.meso.plan&&x.meso.cursor&&x.meso.log))x.meso=null;
  if(x.draft&&!(x.meso&&x.draft.sets&&x.draft.ex&&x.meso.days[x.draft.d]))x.draft=null;
  return x;
}

}

async function driveFind(){

adopt(load()||defaults());

function newPf(){return {name:'',age:'',sex:'m',units:(S.settings&&S.settings.units)||'lb',
  bw:'',ht:'',htFt:'',htIn:'',exp:'mid',goal:'gain',activity:'med',meals:4};}
const V={screen:!S.profile?'profile':(S.meso?'home':'welcome'),setup:null,fb:null,progEx:null,planWeek:null,dp:{train:'pm',window:'std'},
  timerEnd:0,timerTotal:0,lastChanges:null,confirmReset:false,pf:newPf()};

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* LOCAL calendar date. (toISOString is UTC — an evening workout on the US west
   coast used to be stamped with tomorrow's date.) */
const today=()=>{const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const r25=x=>Math.round(x/2.5)*2.5;
const e1rm=(w,r)=>r>0?(w>0?w*(1+r/30):r):0;
const unit=()=>S.settings.units;
const isKg=()=>unit()==='kg';

/* ---------- How a lift is loaded ----------
   Most lifts: the number you type IS the load. Pull-ups, chin-ups and dips
   also move your bodyweight, so +10 lb on a pull-up is a ~5% jump, not an
   infinite one. Assisted machines SUBTRACT the number from your bodyweight —
   more assistance is EASIER, so progress there means the number goes DOWN. */
function loadInfo(ex){
  if(!ex)return {kind:'ext',f:0};
  if(ex._li)return ex._li;
  const n=ex.name;let li={kind:'ext',f:0};
  if(/assisted/i.test(n))li={kind:'assist',f:1};
  else if(/(pull-?up|chin-?up|\bdip\b)/i.test(n)&&!/machine/i.test(n))li={kind:'bw',f:1};
  else if(/push-?up/i.test(n))li={kind:'bw',f:0.65};
  return ex._li=li;
}
function bwNow(){
  const b=S&&S.bw&&S.bw.length?S.bw[S.bw.length-1].v:(S&&S.profile&&S.profile.bw);
  return +b||0;
}
function effLoad(ex,w){
  const li=loadInfo(ex),bw=bwNow();w=+w||0;
  if(li.kind==='assist')return bw>0?Math.max(bw*0.15,bw-w):Math.max(1,(isKg()?90:200)-w);
  // Some lifters log the TOTAL on bodyweight lifts ("175" for a bodyweight dip),
  // others only what they hang from the belt. An entry that's most of your
  // bodyweight is read as the total; anything smaller as added load.
  if(li.kind==='bw')return (bw>0&&w>=0.6*bw*li.f)?w:bw*li.f+w;
  return w;
}
/* Estimated strength of a set (Epley) on the EFFECTIVE load. Zero-load lifts
   (crunches, leg raises) fall back to reps so more reps still reads as progress. */
function e1x(ex,w,r){const L=effLoad(ex,w);r=+r||0;return r>0?(L>0?L*(1+r/30):r):0;}
/* Capacity = what a set says you could do all-out: the reps you did PLUS the
   reps you were told to leave in reserve. 8 reps at 2 RIR and 10 reps at
   0 RIR are the same strength — comparing raw sets across weeks with
   different RIR targets made every new block look like a decline. */
function capOf(ex,rec){
  if(!rec)return 0;
  return e1x(ex,rec.w,(+rec.r||0)+(rec.rir!=null?+rec.rir:1));
}
/* Inverse Epley: the most reps that capacity predicts at load w. */
function repsAt(ex,cap,w){const L=effLoad(ex,w);return L>0?30*(cap/L-1):0;}
/* Switching lb <-> kg converts every stored number (targets, history, bests,
   bodyweight, height) — relabeling alone would turn 135 lb into "135 kg". */
function convertUnits(to){
  const from=unit();if(to===from)return;
  const f=to==='kg'?1/2.20462:2.20462;
  const cw=v=>{v=+v;return v>0?(to==='kg'?Math.round(v*f*2)/2:Math.round(v*f)):v;};
  const scale=(id,w)=>{const ex=EX[id];return (loadInfo(ex).kind==='ext'&&!(+w>0))?1:f;}; // rep-only lifts are unitless
  Object.keys(S.lastPerf).forEach(id=>{const lp=S.lastPerf[id],k=scale(id,lp.w);
    lp.w=cw(lp.w);(lp.sets||[]).forEach(x=>x.w=cw(x.w));
    if(lp.est)lp.est*=k;if(lp.prevEst)lp.prevEst*=k;});
  Object.keys(S.best||{}).forEach(id=>{const b=S.best[id];b.cap*=scale(id,b.w);b.w=cw(b.w);});
  [S.meso].concat(S.archive).filter(Boolean).forEach(M=>Object.values(M.log||{}).forEach(l=>
    (l.entries||[]).forEach(e=>e.sets.forEach(x=>x.w=cw(x.w)))));
  if(S.draft)Object.values(S.draft.sets).forEach(a=>a.forEach(x=>{if(String(x.w||'').trim())x.w=String(cw(x.w));}));
  S.bw.forEach(b=>b.v=Math.round(b.v*f*10)/10);
  if(S.profile){S.profile.bw=Math.round(S.profile.bw*f*10)/10;
    S.profile.ht=to==='kg'?Math.round(S.profile.ht*2.54):Math.round(S.profile.ht/2.54);

}
function toast(msg,isErr){const t=$('#toast');t.textContent=msg;
  t.classList.toggle('err',!!isErr);t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),isErr?3200:2200);}

/* Typo guard: an absurd entry (2500 lb instead of 25) would poison the
   progression targets and the est-1RM fatigue trend, so refuse it at the
   checkmark instead of letting it into the data. */
function setInputError(exId,w,r){
  const kg=isKg();
  if(!(r>0))return 'Enter reps before checking the set';
  if(r>99)return 'Too many reps entered — double-check that number';
  if(r!==Math.round(r))return 'Reps must be a whole number';
  if(w<0)return 'Weight can\'t be negative';
  if(w>(kg?700:1500))return 'Weight too high — double-check that number';
  const ex=EX[exId];
  if(ex&&loadInfo(ex).kind==='assist'&&bwNow()>0&&w>=bwNow())
    return 'Assistance can\'t be more than your bodyweight — double-check that number';
  return null;
}

/* ---------- RIR schedule ----------
   Accumulation ramps 2 RIR -> 0 RIR (longer blocks hold 2 RIR for the early
   weeks); the final week is the deload. */
function rirFor(w,weeks){
  if(w>=weeks)return 8;                       // deload: finish every set fresh
  const accum=weeks-1;
  const base=Math.max(0,Math.min(2,accum-w)); // ramp ends at 0: e.g. 3 accum = 2,1,0
  return Math.max(placement(S&&S.profile).rirCap,base); // beginners & 55+ never hit 0 RIR
}

/* ---------- Meso construction ---------- */
function distribute(total,k){
  const base=Math.floor(total/k),rem=total-base*k;
  return Array.from({length:k},(_,i)=>Math.max(1,base+(i<rem?1:0)));
}
/* ⭐ Favorites bias: each training day, the FIRST slot of a muscle becomes one
   of the user's favorite lifts for that muscle (rotating across days so the
   week stays varied). Program structure — which muscles, how often — is
   untouched; only the exercise filling the slot changes. */
function applyFavorites(days){
  const favs=(S&&S.favs||[]).filter(id=>EX[id]&&MUSCLES[EX[id].m]);
  if(!favs.length)return;
  const byM={},nUsed={};favs.forEach(id=>(byM[EX[id].m]=byM[EX[id].m]||[]).push(id));
  days.forEach(dy=>{
    const used=new Set(dy.slots.map(s=>s.ex));
    Object.keys(byM).forEach(m=>{
      const si=dy.slots.findIndex(s=>s.m===m);
      if(si<0)return;
      const k=nUsed[m]||0;nUsed[m]=k+1;         // rotate per occurrence, not per day
      const pick=byM[m][k%byM[m].length];
      if(!used.has(pick)){used.delete(dy.slots[si].ex);dy.slots[si].ex=pick;used.add(pick);}
    });
  });
}
/* Session order per the hypertrophy evidence: big compound lifts first (they
   need — and reward — the freshest effort; performance drop hits them
   hardest), isolation work after, abs & calves last (they interfere least
   and recover fastest). Stable within each tier so preset order survives. */
function hypertrophyOrder(slots,prioMap){
  const pm=prioMap||{};
  const rank=s=>{if(s.m==='abs'||s.m==='calves')return 2;return (EX[s.ex]||{}).big?0:1;};
  // within a tier, Emphasized muscles go first: whatever is trained freshest
  // gets the best sets (the "priority principle")
  const pr=s=>pm[s.m]==='E'?0:pm[s.m]==='M'?2:1;
  return slots.map((s,i)=>({s,i})).sort((a,b)=>rank(a.s)-rank(b.s)||pr(a.s)-pr(b.s)||a.i-b.i).map(x=>x.s);
}
/* A replacement for a lift: same muscle, favorites first, skipping anything
   already in the day, pain-flagged, or on the excluded list. */
const MOVE_PATTERNS=[/pulldown|pull-?up|\bchin|pullover|straight-arm|high row/,/\brow/,/fly|pec deck|crossover/,
  /press|push-?up|\bdip|bench/,/lateral|raise|upright/,/leg curl|nordic/,/\bcurl/,
  /deadlift|good morning|back ext|back raise|hyper/,/extension|pushdown|skull/,
  /squat|leg press|lunge|step-?up/,/thrust|bridge|kickback|abduction/,
  /calf|calves/,/crunch|knee|leg raise|rollout|sit-?up|candlestick/];
function movePattern(ex){const n=ex.name.toLowerCase();const i=MOVE_PATTERNS.findIndex(r=>r.test(n));return i;}
function altFor(exId,avoid){
  const ex=EX[exId];if(!ex)return null;
  const skip=new Set(avoid||[]);skip.add(exId);
  const opts=exOptions(ex.m).filter(e=>!skip.has(e.id));
  if(!opts.length)return null;
  // closest substitute first: the same movement (a pulldown for a pulldown) on
  // different equipment — a different tool often clears a cranky joint — then
  // the same movement on anything, then any lift of the same size for that muscle
  const eq=e=>e.equip||equipOf(e.name),pt=movePattern(ex);
  const samePat=opts.filter(e=>pt>=0&&movePattern(e)===pt);
  const sameBig=opts.filter(e=>e.big===ex.big);
  return (samePat.find(e=>eq(e)!==eq(ex))||samePat[0]||sameBig.find(e=>eq(e)!==eq(ex))||sameBig[0]||opts[0]).id;
}
/* Emphasis is extra weekly volume. A muscle marked Emphasize that is trained
   fewer than twice a week gets a second (or first two) slot on the lightest
   day(s) that don't already hit it — 3 sets on one lift isn't specialization. */
function ensureEmphasisSlots(days,prioMap){
  Object.keys(prioMap||{}).filter(m=>prioMap[m]==='E'&&MUSCLES[m]).forEach(m=>{
    let guard=0;
    while(guard++<2){
      const has=days.map(d=>d.slots.some(s=>s.m===m));
      if(has.filter(Boolean).length>=Math.min(2,days.length))break;
      const cands=days.map((d,i)=>({d,i})).filter(x=>!has[x.i]&&x.d.slots.length<MAX_EX_PER_DAY)
        .sort((a,b)=>a.d.slots.length-b.d.slots.length);
      if(!cands.length)break;
      const usedWeek=new Set([].concat(...days.map(d=>d.slots.map(s=>s.ex))));
      const pick=exOptions(m).find(e=>!usedWeek.has(e.id))||exOptions(m)[0];
      if(!pick)break;
      cands[0].d.slots.push({m,ex:pick.id});

function createMeso(cfg){
  const days=cfg.days.map(d=>({name:d.name,slots:d.slots.map(s=>({m:s[0],ex:s[1]}))}));
  if(!cfg.carried)applyFavorites(days);
  ensureEmphasisSlots(days,cfg.prioMap);
  days.forEach(d=>{d.slots=hypertrophyOrder(d.slots,cfg.prioMap);
    // a session is 6-8 quality exercises, not 12. Trim by REDUNDANCY, not
    // position: drop the last lift of whichever muscle has the most lifts
    // that day, so a long template loses its third chest press before it
    // loses its only curl.
    while(d.slots.length>MAX_EX_PER_DAY){
      const cnt={};d.slots.forEach(s=>cnt[s.m]=(cnt[s.m]||0)+1);
      const mx=Math.max(...Object.values(cnt));
      let idx=d.slots.length-1;
      for(let i=d.slots.length-1;i>=0;i--)if(cnt[d.slots[i].m]===mx){idx=i;break;}
      d.slots.splice(idx,1);
    }});
  // gather weekly slot positions per muscle
  const pos={};
  days.forEach((d,di)=>d.slots.forEach((s,si)=>{(pos[s.m]=pos[s.m]||[]).push([di,si]);}));
  const plan={};
  days.forEach((d,di)=>plan['1_'+di]=d.slots.map(()=>0));
  // Week-1 seeding: 2 sets per slot, 3 for Emphasized muscles — never more.
  // Reps and load are the progression; sets are a slow secondary lever.
  const pmT=cfg.prioMap||{};
  Object.keys(pos).forEach(m=>{
    const per=(pmT[m]||'G')==='E'?3:2;
    pos[m].forEach(p=>{plan['1_'+p[0]][p[1]]=per;});
  });
  // Recoverable-ceiling pass: no muscle STARTS a block above what this lifter
  // can recover from (landmarks are scaled to age / experience / size). A
  // glute-heavy template would otherwise hand a 60-year-old 19 effective
  // glute sets in week 1 against a ceiling of 11. Trim that muscle's own
  // lifts to 1 set, last-in-the-week first, until it fits.
  const effOf=m=>{let e=0;days.forEach((d,di)=>d.slots.forEach((s,si)=>{const n=plan['1_'+di][si];
    if(s.m===m)e+=n;else if(synergists(EX[s.ex]).includes(m))e+=n/2;}));return e;};
  Object.keys(pos).forEach(m=>{
    const L=LM(m),ceil=(pmT[m]||'G')==='E'?L.mrv-1:L.mav;let guard=0;
    while(effOf(m)>ceil&&guard++<40){
      let best=null;
      pos[m].forEach(q=>{const n=plan['1_'+q[0]][q[1]];if(n>1&&(!best||n>=best.n))best={q,n};});
      if(!best)break;
      plan['1_'+best.q[0]][best.q[1]]--;
    }
  });
  return {id:Date.now(),created:today(),weeks:cfg.weeks,daysPerWeek:days.length,
    splitName:cfg.splitName||(SPLITS[cfg.daysKey]?SPLITS[cfg.daysKey].name:'Custom'),daysKey:cfg.daysKey,
    preset:cfg.preset||'balanced',
    prios:cfg.prios,prioMap:cfg.prioMap||{},days,plan,log:{},cursor:{w:1,d:0},done:false};
}

/* Targets for (week, day): plan entry, else deload = half of week 1,
   else fall back to the latest earlier week generated for that day. */
/* Session ceiling: past ~15-20 hard sets in one session, per-set quality
   collapses and the extra work is fatigue, not stimulus ("junk volume").
   16 is the ceiling for every workout; set counts scale down to fit —
   3s are trimmed before any 2 is touched. */
const SESSION_CAP=16,MAX_EX_PER_DAY=8;
function sessionCap(){return (S.settings&&S.settings.sessionCap)||SESSION_CAP;}
function capSession(arr){
  const CAP=sessionCap();let sum=arr.reduce((a,b)=>a+b,0);
  if(sum<=CAP)return arr;
  const out=arr.slice();
  const lower=min=>{while(sum>CAP){let i=-1,best=min;
    out.forEach((v,j)=>{if(v>best){best=v;i=j;}});if(i<0)return;out[i]--;sum--;}};
  lower(2);lower(1);
  return out;
}
function targetsFor(w,d){
  const M=S.meso;if(!M)return null;
  if(w>=M.weeks){return M.plan['1_'+d].map(()=>1);} // deload: 1 set per exercise
  // 2-3 working sets per exercise, HARD max 3 — progression lives in reps and
  // load, not stacked sets. Also retro-caps any older plan that grew past 3.
  const cap=t=>Math.min(3,Math.max(1,t||1));
  if(M.plan[w+'_'+d])return capSession(M.plan[w+'_'+d].map(cap));
  for(let x=w-1;x>=1;x--)if(M.plan[x+'_'+d])return capSession(M.plan[x+'_'+d].map(cap));
  return capSession(M.days[d].slots.map(()=>2));
}
function muscleWeekSets(M,w,m){ // planned weekly sets for muscle at week w
  let t=0;
  for(let d=0;d<M.daysPerWeek;d++){
    const tg=targetsFor(w,d)||[];
    M.days[d].slots.forEach((s,i)=>{if(s.m===m)t+=tg[i]||0;});
  }
  return t;
}

/* ---------- The autoregulation algorithm ----------
   Reps and load carry the progression; SETS RARELY MOVE. One tap of feedback
   is a nudge, not a rewrite:
     'easy'  -> +1 set for at most TWO muscles next week — Emphasized first,
                then whichever sits lowest against its volume ceiling — and
                never a muscle whose lifts just got weaker (more work is the
                wrong fix for a muscle that isn't recovering).
     'hard'  -> −1 set for at most TWO muscles — the ones that lost strength
                first, then the ones carrying the most sets.
     per-muscle 'more' / 'less' apply exactly as asked.
   Limits: 3 sets per lift, the muscle's weekly ceiling (counting half-credit
   from compounds), and the session cap. perf = {muscle:'up'|'flat'|'down'}
   from this session's strength vs. last time. */
function applyProgression(w,d,fb,perf){
  const M=S.meso,nw=w+1,changes=[];
  if(nw>=M.weeks)return changes;        // next week is deload: fixed plan
  fb=fb||{};perf=perf||{};
  const CAP=3;
  const cur=targetsFor(w,d);
  const next=cur.slice();
  const slots=M.days[d].slots;
  const ms=[...new Set(slots.map(s=>s.m))];
  const prio=m=>(M.prioMap&&M.prioMap[m])||'G';
  const idxs=m=>slots.map((s,i)=>s.m===m?i:-1).filter(i=>i>=0);
  const daySets=(m,arr)=>idxs(m).reduce((a,i)=>a+arr[i],0);
  const room=m=>{const L=LM(m);return (L.mav-muscleWeekVol(M,w,m).eff)/Math.max(1,L.mav);};
  const mus=fb.mus||{};
  const adds=[],cuts=[];
  ms.forEach(m=>{if(mus[m]==='more')adds.push(m);else if(mus[m]==='less')cuts.push(m);});
  const free=ms.filter(m=>!mus[m]);
  if(fb.overall==='easy'){
    free.filter(m=>prio(m)!=='M'&&perf[m]!=='down')
      .sort((a,b)=>(prio(a)==='E'?0:1)-(prio(b)==='E'?0:1)||room(b)-room(a))
      .slice(0,2).forEach(m=>adds.push(m));
  }else if(fb.overall==='hard'){
    free.filter(m=>daySets(m,cur)>1)
      .sort((a,b)=>(perf[a]==='down'?0:1)-(perf[b]==='down'?0:1)
        ||(prio(a)==='E'?1:0)-(prio(b)==='E'?1:0)||daySets(b,cur)-daySets(a,cur))
      .slice(0,2).forEach(m=>cuts.push(m));
  }
  adds.forEach(m=>{
    if(prio(m)==='M')return;                          // Maintain: never add
    const L=LM(m),vol=muscleWeekVol(M,w,m);
    const open=idxs(m).filter(i=>next[i]<CAP).sort((a,b)=>next[a]-next[b]);
    const sessionTotal=next.reduce((a,b)=>a+b,0);
    if(open.length&&vol.eff+1<=L.mav&&sessionTotal+1<=sessionCap())next[open[0]]++;
  });
  cuts.forEach(m=>{
    const big=idxs(m).slice().sort((a,b)=>next[b]-next[a])[0];
    if(big!=null&&next[big]>1)next[big]--;
  });
  ms.forEach(m=>{changes.push({m,from:daySets(m,cur),to:daySets(m,next),perf:perf[m]||null});});
  M.plan[nw+'_'+d]=next;
  return changes;
}

/* ---------- Dynamic load progression ----------
   Every set is coached against the SAME set last time (set 2 vs set 2 — a
   second set is always a rep or two behind the first, so judging it against
   your best set just prints red arrows).

   Reps to add vs last time:
     RIR target dropped   -> + the drop (the harder effort funds the rep)
     RIR target unchanged -> +1 (you've adapted; this is the overload —
                             without it a beginner held at 2 RIR, or weeks
                             1-3 of a long block, were never asked to progress)
     RIR target rose      -> back OFF by the difference (new block after an
                             all-out week: 10 @ 0 RIR -> 8 @ 2 RIR)

   Double progression: reps climb to the top of the working range (12 big
   lifts / 15 isolation), then the load steps up and reps restart lower, the
   new rep target derived from your estimated max at the new load. The step
   is only taken when it's FEASIBLE — if the next dumbbell would drop you
   under a productive rep count, reps keep climbing until it won't. */
function fmtSet(w,r){return (w>0?w+' × ':'')+r;}
/* The range a lift is actually worked in: lo → top is where reps climb before
   the load steps up (12 for big lifts, 15 for isolation — heavy, concentrated
   sets, not cardio); floor is the fewest reps a load step may leave you with.
   Lifters on the joint-friendly track keep their whole, higher range. */
function workRange(ex){
  const rr=repRange(ex);
  const hiTrack=placement(S&&S.profile).repHigh;
  let top=hiTrack?rr.hi:Math.min(rr.hi,ex.big?12:15);
  top=Math.min(rr.hi,Math.max(top,rr.lo+2));
  const floor=ex.big||hiTrack?rr.lo:Math.max(6,rr.lo-4);
  return {lo:rr.lo,top,hi:rr.hi,floor};
}
function repAdj(lp,curRir){
  if(lp.rir==null)return 1;
  const d=lp.rir-curRir;
  return d>0?d:d===0?1:d;
}
function nextTarget(exId,w,xi){
  const M=S.meso,lp=S.lastPerf[exId],ex=EX[exId];
  if(!lp||!ex)return null;
  xi=xi||0;
  const hist=(lp.sets&&lp.sets.length)?lp.sets:[{w:lp.w,r:lp.r}];
  const over=Math.max(0,xi-(hist.length-1));
  const h=hist[Math.min(xi,hist.length-1)];
  // a set beyond last session's count: expect about one rep less than the set before it
  const base={w:+h.w||0,r:Math.max(1,(+h.r||1)-over)};
  const lead={w:+hist[0].w||0,r:+hist[0].r||1};
  if(M&&w>=M.weeks)return {w:lead.w,reps:Math.max(3,Math.ceil(lead.r/2)),alt:null,
    note:'Deload — 1 easy set, about half your reps',down:false};
  const rr=repRange(ex);
  if(M&&M.painFlags&&M.painFlags[exId])return {w:base.w,reps:base.r,alt:null,pain:true,
    note:'Joint pain flagged — match '+fmtSet(base.w,base.r)+' with clean reps, or swap it below',down:true};
  const down=!!(lp.prevEst&&lp.est<lp.prevEst*0.97);
  const curRir=M?rirFor(w,M.weeks):2,lastRir=lp.rir!=null?+lp.rir:1;
  const adj=repAdj(lp,curRir);
  const li=loadInfo(ex);
  const wr=workRange(ex),top=wr.top,floor=wr.floor;
  // --- the lead set decides whether the load moves ---
  const leadReps=Math.max(1,lead.r+adj);
  let bumpW=null;
  if(leadReps>top&&lead.w>0){
    let nw;
    if(li.kind==='assist'){const st=isKg()?5:10;nw=Math.max(0,lead.w-st);}
    else{const st=loadStep(ex,lead.w);nw=Math.round((lead.w+st)/st)*st;}
    if(nw!==lead.w){
      const pred=Math.round(repsAt(ex,capOf(ex,{w:lead.w,r:lead.r,rir:lastRir}),nw)-curRir);
      if(pred>=floor||leadReps>rr.hi)bumpW=nw;
    }
  }
  let wt=base.w,reps=Math.max(1,base.r+adj),bumped=false;
  if(bumpW!=null&&base.w===lead.w){
    wt=bumpW;bumped=true;
    const pred=Math.round(repsAt(ex,capOf(ex,{w:base.w,r:base.r,rir:lastRir}),wt)-curRir);
    reps=Math.max(xi===0?floor:Math.max(4,floor-2),Math.min(top,pred));
  }else if(reps>top){
    // step not feasible yet, or nothing to add load to: reps keep climbing (a little further at bodyweight)
    reps=Math.min(reps,lead.w===0?Math.max(rr.hi,15):Math.max(top,rr.hi));
  }
  let note;
  if(bumped){
    note=li.kind==='assist'
      ?'Topped '+top+' reps — less help now: '+(wt>0?wt+' assist × '+reps:'unassisted × '+reps)
      :'Topped '+top+' reps at '+(lead.w>0?lead.w:'bodyweight')+' — move up to '+fmtSet(wt,reps);
    note+=' ('+curRir+' RIR)';
  }else{
    note=(down?'Chasing your actual — ':'Last time '+fmtSet(base.w,base.r)+' — ')+'aim for '+reps
      +(adj<0?' (backing off to honor '+curRir+' RIR — last time was closer to max)':'')
      +(leadReps>top&&li.kind!=='assist'&&lead.w===0?' · top of the range — add weight or a harder variation when this gets easy':'')
      +(leadReps>top&&lead.w>0?' · the next weight jump is too big for now — own these reps first':'');
  }
  return {w:wt,reps,alt:null,note,down,bumped,back:adj<0};
}
/* One honest plate-step for the equipment: small lifts / light loads move in
   2.5 lb (1.25 kg); compounds and anything heavier move in 5 lb (2.5 kg). */
function loadStep(ex,w){
  if(isKg())return (ex.big||w>=40)?2.5:1.25;
  return (ex.big||w>=60)?5:2.5;
}
function suggest(exId,w){ // weight prefill + warm-up source
  const t=nextTarget(exId,w,0);
  return t?{w:t.w,note:t.note}:null;
}
/* ▲ ▼ ✓ for a logged set, judged against the SAME set last time by estimated
   strength (so 60×12 beats 50×15). On a planned back-off week the bar is the
   target, not last time's all-out number. */
function setArrow(exId,w,xi,x){
  const lp=S.lastPerf[exId],ex=EX[exId];
  if(!lp||!ex||!(+x.r))return '✓';
  const t=nextTarget(exId,w,xi);
  const hist=(lp.sets&&lp.sets.length)?lp.sets:[{w:lp.w,r:lp.r}];
  const ref=(t&&t.back)?{w:t.w,r:t.reps}:(xi<hist.length?hist[xi]:null);
  if(!ref)return '✓';
  const a=e1x(ex,+x.w||0,+x.r),b=e1x(ex,+ref.w||0,+ref.r);
  if(!(b>0))return '✓';
  return a>b*1.005?'▲':a<b*0.995?'▼':'✓';
}

/* ---------- Draft (in-progress workout, survives reload) ---------- */
function beginWorkout(){
  const M=S.meso,{w,d}=M.cursor;
  if(S.draft&&S.draft.w===w&&S.draft.d===d){V.screen='workout';render();return;}
  const tg=targetsFor(w,d);
  S.draft={w,d,startedAt:today(),t0:Date.now(),ex:{},sets:{}};
  M.days[d].slots.forEach((s,i)=>{
    S.draft.ex[i]=s.ex;
    // weight stays EMPTY with the suggestion as a placeholder (same feel as
    // reps): type fresh digits, or just tap ✓ to accept the suggestion as-is
    S.draft.sets[i]=Array.from({length:tg[i]},()=>({w:'',r:'',done:false}));
  });
  save();V.screen='workout';render();
}
function finishWorkout(){
  const left=Object.values(S.draft.sets).flat().filter(x=>!x.done).length;
  if(left){toast(left+' set'+(left>1?'s':'')+' still unlogged \u2014 log them or remove extras with \u2212 set');return;}
  const M=S.meso,{w,d}=S.draft;
  const musclesDone=[...new Set(M.days[d].slots
    .map((s,i)=>({m:s.m,any:(S.draft.sets[i]||[]).some(x=>x.done&&+x.r>0)}))
    .filter(x=>x.any).map(x=>x.m))];
  if(!musclesDone.length){toast('Log at least one set first');return;}
  stopTimer();
  if(w>=M.weeks){completeDay({});return;}  // deload: no feedback needed
  V.fb={list:musclesDone,overall:null,mus:{},pain:[]};
  V.screen='feedback';render();
}
function completeDay(fbAns){
  const M=S.meso,{w,d}=S.draft;
  const entries=M.days[d].slots.map((s,i)=>({
    ex:S.draft.ex[i],m:s.m,
    sets:(S.draft.sets[i]||[]).filter(x=>x.done&&+x.r>0).map(x=>({w:+x.w||0,r:+x.r})),
  })).filter(e=>e.sets.length);
  // What the app learns from the log. Every lift's best set becomes a
  // CAPACITY estimate (reps + the reps held in reserve), compared with the
  // last time it was trained: per-lift trend, per-muscle trend, all-time
  // bests, and the per-set history next session's targets are built from.
  let downCt=0,scored=0,volLoad=0,repsTot=0,setsTot=0;
  const ratios={},prs=[],rirNow=rirFor(w,M.weeks);
  entries.forEach(e=>{
    const ex=EX[e.ex];
    e.sets.forEach(x=>{volLoad+=effLoad(ex,x.w)*x.r;repsTot+=x.r;setsTot++;});
    const best=e.sets.reduce((a,x)=>e1x(ex,x.w,x.r)>e1x(ex,a.w,a.r)?x:a,e.sets[0]);
    if(w<M.weeks){
      const old=S.lastPerf[e.ex];
      const est=capOf(ex,{w:best.w,r:best.r,rir:rirNow});
      const prevEst=old?capOf(ex,old):null;
      if(prevEst>0){scored++;const q=est/prevEst;if(q<0.97)downCt++;
        (ratios[e.m]=ratios[e.m]||[]).push(q);}
      S.best=S.best||{};const b=S.best[e.ex];
      if(b&&b.cap>0&&est>b.cap*1.005)prs.push({ex:e.ex,w:best.w,r:best.r,pct:Math.round((est/b.cap-1)*1000)/10});
      if(!b||est>b.cap)S.best[e.ex]={cap:est,w:best.w,r:best.r,date:today()};
      S.lastPerf[e.ex]={w:best.w,r:best.r,date:today(),est,prevEst:prevEst||null,
        rir:rirNow,                               // HOW HARD it was, not just what it was
        sets:e.sets.map(x=>({w:x.w,r:x.r}))};     // set-by-set, for per-set targets
    }
  });
  const perf={};
  Object.keys(ratios).forEach(m=>{const a=ratios[m].reduce((x,y)=>x+y,0)/ratios[m].length;
    perf[m]=a<0.97?'down':a>1.01?'up':'flat';});
  // HMSIT: performance falling across sessions = MRV reached → deload advice
  if(w<M.weeks){
    if(scored>=2&&downCt>=Math.ceil(scored/2))M.downStreak=(M.downStreak||0)+1;
    else if(scored>=2)M.downStreak=0;
  }
  const mins=S.draft.t0?Math.round((Date.now()-S.draft.t0)/6e4):0;
  M.log[w+'_'+d]={date:today(),entries,fb:fbAns,perfDown:downCt,perfScored:scored,rir:rirNow,perf,
    mins:mins>0&&mins<240?mins:undefined};
  S.workoutsSinceBackup=(S.workoutsSinceBackup||0)+1;
  V.lastChanges=applyProgression(w,d,fbAns,perf);
  V.lastSummary={prs,sets:setsTot,reps:repsTot,vol:Math.round(volLoad),mins:mins>0&&mins<240?mins:0,
    perf,deload:w>=M.weeks,day:M.days[d].name};
  // start each trained muscle's recovery timer (drives flexible scheduling)
  const setsByM={};
  entries.forEach(e=>{setsByM[e.m]=(setsByM[e.m]||0)+e.sets.length;});
  S.recLog=S.recLog||{};
  Object.keys(setsByM).forEach(m=>{S.recLog[m]={t:Date.now(),sets:setsByM[m]};});
  // advance
  if(M.flex){
    M.flexDone=M.flexDone||{};M.flexDone[d]=1;
    if(Object.keys(M.flexDone).length>=M.daysPerWeek){
      M.flexDone={};M.cursor.d=0;M.cursor.w++;
    }else M.cursor.d=recommendDay();
    if(M.cursor.w>M.weeks)M.done=true;
  }else{
    M.cursor.d++;
    if(M.cursor.d>=M.daysPerWeek){M.cursor.d=0;M.cursor.w++;}
    if(M.cursor.w>M.weeks)M.done=true;
  }
  S.draft=null;save();
  // NEVER auto-open the Google token screen (the flash annoyed the user).
  // Every workout counts as unsynced until a push actually SUCCEEDS
  // (drivePush clears the counter); Today shows a one-tap Sync card.
  if(driveOn()){S.drive.dirty=(S.drive.dirty||0)+1;saveQuiet();}
  V.screen='summary';V.fb=null;render();
}
function skipDay(){
  stopTimer();
  const M=S.meso,{w,d}=M.cursor;
  if(w+1<M.weeks&&!M.plan[(w+1)+'_'+d])M.plan[(w+1)+'_'+d]=targetsFor(w,d);
  M.log[w+'_'+d]={date:today(),skipped:true};
  if(M.flex){
    M.flexDone=M.flexDone||{};M.flexDone[d]=1;
    if(Object.keys(M.flexDone).length>=M.daysPerWeek){
      M.flexDone={};M.cursor.d=0;M.cursor.w++;
    }else M.cursor.d=recommendDay();
    if(M.cursor.w>M.weeks)M.done=true;
  }else{
    M.cursor.d++;
    if(M.cursor.d>=M.daysPerWeek){M.cursor.d=0;M.cursor.w++;}
    if(M.cursor.w>M.weeks)M.done=true;
  }
  S.draft=null;save();render();
}

/* ---------- Warm-up ladder (safe-lifting protocol) ----------
   Ramping sets scale with the working weight; heavier work = more steps. */
function warmupPlan(w){
  if(!w||w<=0)return null;
  const ladder=w<100?[[.5,10],[.75,5]]
    :w<300?[[.3,12],[.55,8],[.8,4]]
    :[[.25,12],[.45,8],[.65,5],[.85,3]];
  return ladder.map(x=>({w:Math.max(2.5,r25(w*x[0])),r:x[1]}));
}

/* ---------- Rest timer ---------- */
let tInt=null,tHide=null;
function stopTimer(){clearInterval(tInt);clearTimeout(tHide);const el=$('#timerbar');if(el)el.style.display='none';}
function startTimer(secs){
  V.timerEnd=Date.now()+secs*1000;V.timerTotal=secs;
  clearTimeout(tHide);
  $('#timerbar').style.display='flex';
  clearInterval(tInt);tInt=setInterval(tickTimer,250);tickTimer();
}
function tickTimer(){
  const left=Math.max(0,V.timerEnd-Date.now());
  const s=Math.ceil(left/1000);
  $('#tt').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  $('#tbar').style.width=(100*left/(V.timerTotal*1000))+'%';
  if(left<=0){
    clearInterval(tInt);
    try{navigator.vibrate&&navigator.vibrate([180,90,180]);}catch(e){}
    try{const c=new (window.AudioContext||window.webkitAudioContext)();
      const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);
      o.frequency.value=880;g.gain.value=.25;o.start();o.stop(c.currentTime+.3);}catch(e){}
    tHide=setTimeout(()=>{if(V.timerEnd<=Date.now())$('#timerbar').style.display='none';},1600);
  }
}

/* iOS keyboard fix: position:fixed pins to the LAYOUT viewport, so while the
   keyboard is up (or just dismissed mid-scroll) the rest bar and tab bar can
   drift mid-screen and get clipped. Re-pin both to the visual viewport. */
let repin=()=>{};
if(window.visualViewport){
  const vv=window.visualViewport;let vvRaf=0;
  const pin=()=>{vvRaf=0;
    const off=Math.max(0,window.innerHeight-vv.height-vv.offsetTop);
    const t=off>1?'translateY(-'+off+'px)':'';
    const tb=$('#timerbar');if(tb)tb.style.transform=t;
    const tabs=document.querySelector('.tabs');if(tabs)tabs.style.transform=t;};
  repin=()=>{if(!vvRaf)vvRaf=requestAnimationFrame(pin);};
  vv.addEventListener('resize',repin);
  vv.addEventListener('scroll',repin);
}

/* Coming back mid-workout (app switch, phone lock, or iOS reloading the page):
   jump straight to the first exercise with an unlogged set — or the Finish
   button when everything's done. */
function scrollToNextSet(){
  if(V.screen!=='workout'||!S.draft)return;
  const sets=S.draft.sets;
  const si=Object.keys(sets).map(Number).sort((a,b)=>a-b)
    .find(k=>(sets[k]||[]).some(x=>!x.done));
  const el=si==null?$('#finish-slot'):document.getElementById('xcard-'+si);
  if(!el)return;
  // scroll now AND next frame — same trick as render()'s restore; rAF alone
  // can miss the moment iOS unfreezes the page
  const go=()=>window.scrollTo(0,Math.max(0,el.getBoundingClientRect().top+window.scrollY-10));
  go();requestAnimationFrame(go);setTimeout(go,150);
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible')scrollToNextSet();
});
window.addEventListener('pageshow',e=>{if(e.persisted)scrollToNextSet();});

/* ---------- Rendering ---------- */
function render(){
  const app=$('#app');
  const scr={welcome,setup,home,workout,feedback,summary,plan,progress,more,complete,profile,diet,library}[V.screen]||home;
  // scroll to top only when the VIEW changes; in-place updates (logging a set,
  // +/- sets, filters) keep your place on the page
  const viewKey=V.screen
    +(V.screen==='setup'&&V.setup?':'+V.setup.step:'');
  const y=window.scrollY;
  app.innerHTML=scr()+tabsHtml();
  if(V.screen==='progress')drawCharts();
  if(V._viewKey===viewKey){
    // restore twice: immediately, and next frame — iOS keyboard dismissal
    // runs its own scroll adjustment after ours and used to win
    window.scrollTo(0,y);
    requestAnimationFrame(()=>window.scrollTo(0,y));
  }else{window.scrollTo(0,0);
    app.classList.remove('enter');void app.offsetWidth;app.classList.add('enter');}
  V._viewKey=viewKey;
  const ab=$('#about');if(ab)ab.style.display=S.profile?'none':'block';
  repin();
}

          :`<span class="sm">${nameHtml}</span>`}
        <span class="row" style="gap:8px">
          ${x.id&&S.lastPerf[x.id]?`<span class="xs num" style="color:var(--grn)">${esc((S.lastPerf[x.id].date||'').slice(5))}</span>`:''}
          <span class="xs dim num">${x.lo}–${x.hi}</span>
          <span class="chip" style="font-size:.62rem">${esc(x.equip)}</span>

        </span></div>`;}).join('')}
  </div>`).join('')||'<div class="card"><p class="sm mut">No matches.</p></div>'}`;
}

/* ---------- Profile questionnaire ---------- */
function profile(){
  const f=V.pf;
  const seg=(field,opts)=>`<div class="seg">${opts.map(o=>
    `<button class="opt ${f[field]===o[0]?'on':''}" data-a="pfset:${field}:${o[0]}">${o[1]}</button>`).join('')}</div>`;
  const htVal=f.units==='kg'?+f.ht:(+f.htFt*12+(+f.htIn||0));
  const ready=f.name&&+f.age>0&&+f.bw>0&&htVal>0;
  const pl=ready?placement(f):null;
  const dc=ready?dietCalc({...f,goal:f.goal}):null;
  return header()+`
  <h1 style="margin-bottom:4px">${S.profile?'Edit your profile':'Let’s set you up.'}</h1>
  <p class="sm mut" style="margin-bottom:14px">Six quick questions. The app places you into the right
  program and scales every recommendation — training volume, effort, and nutrition — to you.</p>
  <div class="card col">
    <div><div class="lbl" style="margin-bottom:6px">Your name</div>
      <input class="in" type="text" value="${esc(f.name||'')}" placeholder="First name" data-in="pf:name"></div>
    <div class="row">
      <div style="flex:1"><div class="lbl" style="margin-bottom:6px">Age</div>
        <input class="in num" type="number" inputmode="numeric" value="${esc(f.age||'')}" placeholder="" data-in="pf:age"></div>
      <div style="flex:1"><div class="lbl" style="margin-bottom:6px">Height${f.units==='kg'?' (cm)':''}</div>
        ${f.units==='kg'
          ?`<input class="in num" type="number" inputmode="decimal" value="${esc(f.ht||'')}" placeholder="" data-in="pf:ht">`
          :`<div class="row" style="gap:6px">
              <input class="in num" type="number" inputmode="numeric" value="${esc(f.htFt||'')}" placeholder="" data-in="pf:htFt" style="text-align:center">
              <span class="mut">ft</span>
              <input class="in num" type="number" inputmode="numeric" value="${esc(f.htIn||'')}" placeholder="" data-in="pf:htIn" style="text-align:center">
              <span class="mut">in</span>
            </div>`}
      </div>
    </div>
    <div class="row">
      <div style="flex:1"><div class="lbl" style="margin-bottom:6px">Bodyweight (${f.units})</div>
        <input class="in num" type="number" inputmode="decimal" value="${esc(f.bw||'')}" placeholder="" data-in="pf:bw"></div>
      <div><div class="lbl" style="margin-bottom:6px">Units</div>
        <div class="row">${['lb','kg'].map(u=>`<button class="btn small ${f.units===u?'':'ghost'}" data-a="pfset:units:${u}">${u}</button>`).join('')}</div></div>
    </div>
    <div><div class="lbl" style="margin-bottom:6px">Sex</div>${seg('sex',[['m','Male'],['f','Female']])}</div>
    <div><div class="lbl" style="margin-bottom:6px">Lifting experience</div>
      ${seg('exp',[['new','New (<6 months)'],['mid','Some (6mo–2yr)'],['adv','Experienced (2yr+)']])}</div>
    <div><div class="lbl" style="margin-bottom:6px">Main goal right now</div>
      ${seg('goal',[['gain','Build muscle'],['maintain','Recomp / maintain'],['cut','Lose fat']])}</div>
    <div><div class="lbl" style="margin-bottom:6px">Activity outside the gym</div>
      ${seg('activity',[['low','Desk life'],['med','Moderate'],['high','On my feet']])}</div>
  </div>
  ${ready?`<div class="card" style="border-color:var(--red)">
    <div class="lbl" style="margin-bottom:6px">Your placement</div>
    <h2 style="margin-bottom:6px">${pl.label} track</h2>
    <div class="col sm" style="gap:6px">
      <div>• <b>${pl.daysRec} days/week</b> recommended (${SPLITS[pl.daysRec].name})</div>
      <div>• Volume landmarks scaled to <b>${Math.round(pl.scale*100)}%</b> of standard</div>
      <div>• Effort floor: <b>${pl.rirCap} RIR</b> — you'll ${pl.rirCap>0?'never be asked to hit absolute failure':'work all the way to 0 RIR in the final week'}</div>
      ${pl.repHigh?'<div>• Higher rep ranges for joint-friendly loading</div>':''}
      ${dc?`<div>• Nutrition starting point: <b class="num">${dc.cals} kcal</b> · ${dc.protein}g protein/day (${f.goal==='cut'?'fat loss':f.goal==='gain'?'lean muscle gain':'maintenance'})</div>`:''}
    </div>
    ${pl.notes.length?`<p class="xs mut" style="margin-top:8px">${pl.notes.map(esc).join('. ')}.</p>`:''}
  </div>`:''}
  <button class="btn primary" data-a="pf_save" style="${ready?'':'opacity:.6'}">${S.profile?'Save Changes':'Start Training'}</button>
  ${S.profile?`<button class="btn ghost" style="margin-top:8px" data-a="nav:more">Cancel</button>`:''}
  ${!S.profile?`<div class="card" style="margin-top:16px;padding:14px 16px">
    <p class="sm mut" style="margin-bottom:10px">Used the app before? Skip all this — restore your workouts,
    plan and profile from your own Google Drive (same Google account the old app used) or from a
    backup file you saved.</p>
    ${DRIVE.clientId?`<button class="btn" data-a="drive_connect">☁️ Restore from Google Drive</button>`:''}
    <label class="btn ghost" style="margin-top:8px">📄 Restore from backup file<input type="file" accept=".json,application/json" id="importfile" style="display:none"></label>
    <div id="rlog" class="xs mut" style="margin-top:10px;white-space:pre-line">${esc(V.restoreLog||'')}</div>
  </div>`:''}`;
}
/* Live status line for the setup-screen restore — every step reports, so a
   failure says exactly where it died instead of failing silently. */
function rlog(msg){
  V.restoreLog=((V.restoreLog||'')+'\n'+msg).trim();
  const el=document.getElementById('rlog');
  if(el)el.textContent=V.restoreLog;
}

function recipeVid(r){

function mealSlots(){
  const p=S.profile,d=dietCalc(p),pref=S.dietPrefs;
  if(!d||!pref)return null;
  const n=pref.meals;
  const start={early:7,std:8.5,owl:10.5}[pref.window]||8.5;
  const span=Math.min(13,3.5*(n-1));
  const trainH={am:7.5,noon:12,pm:17.5}[pref.train]||17.5;
  const slots=[];
  for(let i=0;i<n;i++){
    const h=start+(n>1?span*i/(n-1):0);
    slots.push({h,label:i===0?'Breakfast':i===n-1?'Last meal':'Meal '+(i+1),
      type:i===0?'bfast':i===n-1?'bed':'main',cw:1,fw:1.15});
  }
  // last meal defaults to low-carb/slow-protein…
  slots[n-1].cw=0.6;slots[n-1].fw=1.2;
  // …but peri-workout needs WIN if they collide with it (post-lift refuel first)
  let pre=-1,post=-1;
  slots.forEach((sl,i)=>{if(sl.h<=trainH)pre=i;});
  if(pre>=0&&pre<n-1)post=pre+1;else if(pre===-1)post=0;
  if(pre>=0){slots[pre].label+=' · Pre-workout';slots[pre].type='pre';slots[pre].cw=1.3;slots[pre].fw=0.5;}
  if(post>=0){slots[post].label+=' · Post-workout';slots[post].type='peri';slots[post].cw=1.5;slots[post].fw=0.5;}
  const cwT=slots.reduce((a,x)=>a+x.cw,0),fwT=slots.reduce((a,x)=>a+x.fw,0);
  slots.forEach(sl=>{
    sl.p=Math.round(d.protein/n);
    sl.c=Math.round(d.carbs*sl.cw/cwT);
    sl.f=Math.round(d.fat*sl.fw/fwT);
    sl.kcal=sl.p*4+sl.c*4+sl.f*9;
    sl.time=(function(h){const hh=Math.floor(h),mm=Math.round((h-hh)*60);
      const ap=hh>=12?'PM':'AM';const h12=((hh+11)%12)+1;
      return h12+':'+String(mm).padStart(2,'0')+' '+ap;})(sl.h);
  });
  return slots;
}
function recipeAllowed(r){
  const a=(S.dietPrefs&&S.dietPrefs.avoid)||[];
  if(a.includes('veg')&&(r.mt||r.rm||r.fs))return false;
  if(a.includes('pesc')&&(r.mt||r.rm))return false;

const MILD_SUBS={'sriracha':'teriyaki sauce','sriracha mayo (light)':'light mayo',
 'salsa':'mild salsa','chili seasoning':'mild chili seasoning (no heat)',
 'chimichurri':'mild chimichurri (no chili flakes)'};
function ingName(n){

/* Style is a hard tier, not a sort: busy = no-cook/5-min (z), fancy = multi-step
   chef-level (fx), std = everything else. A slot only borrows from the next tier
   when its own tier has fewer than 2 options (so the 🔀 swap always works).
   'af' cuts across tiers: it takes every air-fryer recipe (af flag) first,
   then falls back busy → std → fancy for slots the air fryer can't cover. */
function styleTier(r){return r.z?'busy':(r.fx?'fancy':'std');}
function slotRecipes(type){
  let base=RECIPES.filter(r=>r.t.includes(type)&&recipeAllowed(r));
  if(!base.length)base=RECIPES.filter(r=>recipeAllowed(r));
  if(!base.length)base=RECIPES.filter(r=>r.t.includes(type));
  const style=(S.dietPrefs&&S.dietPrefs.style)||'std';
  let pool=[];
  if(style==='af'){
    pool=base.filter(r=>r.af);
    for(const tier of ['busy','std','fancy']){
      if(pool.length>=2)break;
      pool=pool.concat(base.filter(r=>!r.af&&styleTier(r)===tier));
    }
    return pool.length?pool:base;
  }
  const order={busy:['busy','std','fancy'],std:['std','busy','fancy'],
    fancy:['fancy','std','busy']}[style]||['std','busy','fancy'];
  for(const tier of order){
    if(pool.length>=2)break;
    pool=pool.concat(base.filter(r=>styleTier(r)===tier));
  }
  return pool.length?pool:base;
}
function slotRecipe(i,type){

function scaleQty(q,f){const v=q*f;return v>=10?Math.round(v):Math.round(v*4)/4;}
function shoppingList(){

    r.ing.forEach(g=>{
      const key=ingName(g[0])+'|'+g[2]+'|'+g[3];

    });

  const byCat={};
  Object.keys(agg).forEach(k=>{
    const[name,unit,cat]=k.split('|');
    (byCat[cat]=byCat[cat]||[]).push({name,unit,qty:scaleQty(agg[k],1)});
  });

    <details><summary>Reps in reserve (RIR)</summary>

function newSetup(prev){

    // adds and removals are their individual preferences, and rebuilding from
    // the template used to throw all of them away. Lifts flagged for joint
    // pain last block are replaced with a same-muscle alternative.
    const flags=prev.painFlags||{},replaced=[];
    const days=prev.days.map(d=>{const used=new Set(d.slots.map(s=>s.ex));
      return {name:d.name,slots:d.slots.filter(s=>EX[s.ex]&&MUSCLES[s.m]).map(s=>{
        let id=s.ex;
        if(flags[id]){const alt=altFor(id,[...used,...Object.keys(flags)]);
          if(alt){replaced.push(EX[id].name+' → '+EX[alt].name);used.add(alt);id=alt;}}
        return [s.m,id];})};}).filter(d=>d.slots.length);
    if(days.length)return {step:1,daysKey:days.length,weeks:prev.weeks||4,prios:(prev.prios||[]).slice(),
      prioMap:Object.assign({},prev.prioMap||{}),preset:prev.preset||'balanced',days,carried:true,replaced,
      _prevDays:JSON.parse(JSON.stringify(days)),_prevPreset:prev.preset||'balanced'};
  }
  return {step:1,daysKey:dk,weeks:4,prios:[],prioMap:{},preset:rec.preset,days:buildDays(dk,rec.preset)};
}

/* The setup preview is computed from the REAL plan the Start button will
   build (same code path), in effective sets — and it says so plainly when a
   lineup leaves a muscle under-dosed or untrained. */
function previewMeso(st){
  const keep=S.meso;
  const tmp=createMeso({daysKey:st.daysKey,weeks:st.weeks,preset:st.preset,prios:st.prios,
    prioMap:st.prioMap,days:st.days,carried:st.carried});
  S.meso=tmp;
  const vol={};Object.keys(MUSCLES).forEach(m=>vol[m]=muscleWeekVol(tmp,1,m));
  const sess=tmp.days.map((_,d)=>targetsFor(1,d).reduce((a,b)=>a+b,0));
  const mins=tmp.days.map((_,d)=>sessionMinutes(tmp,1,d));
  S.meso=keep;
  return {vol,sess,mins,days:tmp.days};
}
/* Rough session length: each set ≈ 40 s of work + its rest, plus warm-up. */
function sessionMinutes(M,w,d){
  const tg=targetsFor(w,d)||[];let sec=5*60;
  M.days[d].slots.forEach((s,i)=>{const ex=EX[s.ex]||{};
    sec+=(tg[i]||0)*(40+(ex.big?S.settings.restBig:S.settings.restSmall))+45;});
  return Math.round(sec/60/5)*5;
}
function startVolPreview(st){
  const pv=previewMeso(st),pm=st.prioMap||{};
  const row=m=>{const v=pv.vol[m],t=pm[m]||'G';
    const low=t!=='M'&&v.eff<4;
    return `<div class="row between" style="padding:5px 0">
      <span class="sm">${mdot(m)} ${MUSCLES[m].name}${t==='E'?' <span class="red xs">▲</span>':t==='M'?' <span class="dim xs">—</span>':''}</span>
      <span class="sm num ${v.eff===0?'red':low?'amb':'mut'}"><b class="${v.eff===0?'red':low?'amb':''}" style="${v.eff===0||low?'':'color:var(--ink)'}">${v.direct}</b>${v.ind?` <span class="xs dim">+${v.ind/2} from compounds</span>`:''}${v.direct?` <span class="xs dim">· ${v.freq}×/wk</span>`:''}</span>
    </div>`;};
  const none=Object.keys(MUSCLES).filter(m=>pv.vol[m].eff===0);
  const low=Object.keys(MUSCLES).filter(m=>pv.vol[m].eff>0&&pv.vol[m].eff<4&&(pm[m]||'G')!=='M');
  return Object.keys(MUSCLES).map(row).join('')
    +`<p class="xs mut" style="margin-top:8px">Sessions: <b class="num">${pv.sess.join(' / ')}</b> working sets · about <b class="num">${Math.min(...pv.mins)}–${Math.max(...pv.mins)} min</b> each.</p>`
    +(none.length?`<p class="xs red" style="margin-top:6px"><b>Not trained at all:</b> ${none.map(m=>MUSCLES[m].name).join(', ')}. Add a lift for ${none.length>1?'them':'it'} above, or leave ${none.length>1?'them':'it'} out on purpose.</p>`:'')
    +(low.length?`<p class="xs amb" style="margin-top:6px"><b>Light week:</b> ${low.map(m=>MUSCLES[m].name).join(', ')} — under ~4 effective sets, the least that reliably grows a muscle. Fine as a low priority; tap it to Emphasize in step 3 if you want it to grow.</p>`:'');
}

function home(){
  const M=S.meso;
  if(!M)return welcome();

  const {w,d}=M.cursor;
  const deload=w>=M.weeks,rir=rirFor(w,M.weeks);
  const day=M.days[d],tg=targetsFor(w,d);
  const totalSets=tg.reduce((a,b)=>a+b,0);

  const doneCt=weekDoneCount();
  const prog=`
  <div class="row between" style="margin:0 2px 4px">

      const done=(M.flexDone||{})[i];

      const ms=[...new Set(dy.slots.map(s=>s.m))];

      const status=done?'<span class="xs grn">✓ Logged this week</span>'
        :r.ready?'<span class="xs grn">✅ All muscles recovered</span>'

        <div class="row between">

            <div class="row" style="gap:6px;margin-bottom:3px">
              ${isRec?'<span class="chip grn" style="font-size:.6rem">RECOMMENDED</span>':''}
              ${isDraft?'<span class="chip amb" style="font-size:.6rem">IN PROGRESS</span>':''}
            </div>
            <h2 style="margin-bottom:3px">${esc(dy.name)}</h2>
            <div class="row wrap" style="gap:4px;margin-bottom:4px">${ms.map(m=>`<span class="xs" style="color:${MCOLOR[m]||'var(--mut)'}">${mdot(m)}${MUSCLES[m].name}</span>`).join(' ')}</div>
            ${status}
          </div>
          ${done?'':`<button class="btn small ${isRec||isDraft?'':'ghost'}" style="${isRec||isDraft?'background:var(--red);color:#fff':''}" data-a="flex_start:${i}">${isDraft?'Resume':r.ready?'Start':'Start anyway'}</button>`}
        </div>
      </div>`;}).join('');
    return header()+prog+`
    ${deload?`<div class="card" style="border-color:var(--blu);padding:12px 16px"><span class="sm"><b>Deload week</b> — any order, light and easy.</span></div>`:''}
    ${cards}
    <details class="card" style="border-bottom:1px solid var(--line)">
      <summary class="sm">How the recovery timers work</summary>
      <p class="xs mut" style="margin-top:8px">Each muscle gets a timer when you log it, based on how long it
      typically needs before hard training helps again: big lower-body muscles ~3 days (quads, hamstrings),
      most upper-body ~1.5–2 days (chest, back, triceps, glutes), fast recoverers ~1–1.5 days (shoulders,
      biceps, calves, rear delts, abs). A big session on a muscle (8+ sets) adds ~25%; a light one (≤3 sets)
      trims ~25%. Days with every muscle off the clock are marked recovered — train those first. "Start anyway"
      is always there: timers are estimates, your body has the final vote.</p>
    </details>` + homeCards(M,deload);
  }
  const msDay=[...new Set(day.slots.map(s=>s.m))];

  <div class="card hero ${deload?'dl':''}">

      <span class="lbl">Day ${d+1} of ${M.daysPerWeek}</span>
      ${deload?`<span class="chip" style="background:#1d2836;color:var(--blu)">DELOAD</span>`
        :`<span class="chip red">${rir} RIR</span>`}
    </div>
    <h1 style="margin-bottom:6px">${esc(day.name)}</h1>
    <div class="row wrap" style="gap:4px 10px;margin-bottom:10px">${msDay.map(m=>`<span class="xs" style="color:${MCOLOR[m]||'var(--mut)'}">${mdot(m)}${MUSCLES[m].name}</span>`).join('')}</div>
    <div class="stats" style="margin-bottom:14px">
      <div class="stat"><b>${day.slots.length}</b><span>exercises</span></div>
      <div class="stat"><b>${totalSets}</b><span>working sets</span></div>
      <div class="stat"><b>~${sessionMinutes(M,w,d)}</b><span>minutes</span></div>

    ${deload?'<p class="xs mut" style="margin:-4px 0 12px">Easy week — one light set per lift. This is where the growth you earned shows up.</p>':''}
    <button class="btn primary" data-a="start_workout">${resume?'Resume Workout':'Start Workout'}</button>
    <button class="btn ghost" style="margin-top:8px" data-a="skip_day">Skip this day</button>

function homeCards(M,deload){

  ${driveOn()&&(V.driveNeeds||(S.drive.dirty||0)>=3||!S.drive.lastSync||Date.now()-S.drive.lastSync>5*864e5)?`<div class="card" style="padding:12px 16px;border-color:var(--amb)">

    also work the muscle (a row is half a biceps set). Tick = the least that reliably grows it; the bar's end is

`;

function volBars(w){
  const M=S.meso;
  return Object.keys(MUSCLES).map(m=>({m,v:muscleWeekVol(M,w,m)})).filter(x=>x.v.eff>0).map(({m,v})=>{
    const L=LM(m),pr=(M.prioMap&&M.prioMap[m])||'G';
    const pcD=Math.min(100,100*v.direct/L.mrv),pcE=Math.min(100,100*v.eff/L.mrv);
    const low=pr!=='M'&&v.eff<4;
    const color=v.eff>=L.mrv?'var(--red)':v.eff>L.mav?'var(--amb)':'var(--grn)';
    return `<div class="vol"><div class="row between">
      <span class="sm">${mdot(m)} ${L.name}${pr==='E'?' <span class="red xs">▲</span>':pr==='M'?' <span class="dim xs">—</span>':''}${low?' <span class="chip amb" style="font-size:.58rem;padding:2px 6px;margin-left:4px">LIGHT</span>':''}</span>
      <span class="xs mut num"><b style="color:var(--ink)">${v.direct}</b>${v.ind?' +'+(v.ind/2):''} sets${v.freq>1?' · '+v.freq+'×':''}</span></div>
      <div class="track"><div class="fill ind" style="width:${pcE}%;background:${color}"></div>
      <div class="fill" style="width:${pcD}%;background:${color}"></div>
      <div class="tick" style="left:${Math.min(98,100*L.start/L.mrv)}%"></div></div></div>`;
  }).join('');
}

function workout(){
  const M=S.meso,D=S.draft;
  if(!D)return home();
  const {w,d}=D,day=M.days[d],deload=w>=M.weeks,rir=rirFor(w,M.weeks);
  const note=w===1&&!deload?`<div class="card" style="border-color:var(--amb)"><p class="sm">
      <b class="amb">Week 1:</b> find a weight you could lift for the target reps with
      <b>2 reps left in the tank</b>, then enter the reps you completed. That's your baseline — every
      later target chases what you actually do.</p></div>`
    :deload?`<div class="card" style="border-color:var(--blu)"><p class="sm">
      <b style="color:var(--blu)">Deload:</b> one easy set per exercise, about half your usual reps,
      8 reps in the tank. You should finish every set feeling fresh — this week is where you grow.</p></div>`
    :rir===0?`<div class="card" style="border-color:var(--amb)"><p class="sm">
      <b class="amb">Peak week — 0 RIR.</b> Take each set to the last rep you can finish with <b>clean form</b> —

      <span class="st">↔</span><span><b class="blu">Emphasize the stretch.</b> Loading a muscle in its
      lengthened position is the highest-leverage thing you can do for growth. Control the negative,
      hit a full stretch each rep, and if you fail mid-set, grind 2–3 <b>lengthened partials</b> in the
      bottom range.</span></div>`;
  const ex0=EX[D.ex[0]]||EX[day.slots[0].ex];
  const wu0=(function(){
    const typed=parseFloat((D.sets[0]&&D.sets[0][0]&&D.sets[0][0].w)||'');
    const sg0=suggest(ex0.id,w);
    return warmupPlan(typed>0?typed:(sg0?sg0.w:0));
  })();
  const warmup=`<div class="card" style="padding:13px 16px">
    <details>
      <summary>🔥 Warm-up — ${esc(ex0.name)} first ${wu0?`<span class="xs mut num">(${wu0.length} ramp sets)</span>`:''}</summary>
      ${wu0?`<div style="margin-top:8px">${wu0.map((s,i)=>`<div class="slotline">
          <span class="sm num">${i+1}. ${s.w} ${unit()} × ${s.r}</span>
          <span class="xs dim">rest 30–60s</span></div>`).join('')}
        <p class="xs mut" style="margin-top:8px">Optional: 1–4 reps at your working weight to potentiate, then start.
        Later exercises: one light set of ~10 is plenty (do a fuller ramp if that muscle hasn't worked yet today).</p>`
      :`<p class="sm mut" style="margin-top:8px">No weight history yet — warm up in three quick steps with
        ~1 min rests: a very light set of ~12, a moderate set of ~8, then a fairly heavy set of ~4.
        For your working weight, pick anything you could lift 5–30 times; newer lifters do best
        keeping working sets in the 5–10 rep zone at first.</p>`}
      <p class="xs dim" style="margin-top:6px">Feeling rushed, stressed, or under-slept? Warm up <b>more</b>, not less — that's when injuries happen.</p>
    </details>
  </div>`;
  const allSets=Object.values(D.sets).map(a=>a||[]).reduce((a,b)=>a.concat(b),[]);
  const setsDone=allSets.filter(x=>x.done).length,setsTotal=allSets.length||1;
  return `<div class="row between" style="margin:4px 2px 8px">
    <div><div class="lbl">Week ${w} · ${esc(day.name)}</div>
    <h1>${deload?'Deload':rir+' RIR target'}</h1></div>
    <button class="btn small ghost" data-a="nav:home">Close</button></div>
  <div class="row between" style="margin:0 2px 4px">
    <span class="xs mut">Workout progress</span>
    <span id="wp-label" class="xs num ${setsDone>=setsTotal?'grn':'mut'}">${setsDone}/${setsTotal} sets</span>
  </div>
  <div class="wkprog"><div id="wp-fill" class="fill" style="width:${Math.round(100*setsDone/setsTotal)}%"></div></div>`
  +note+principle+warmup
  +day.slots.map((s,si)=>wcard(si)).join('')
  +`<button class="btn ghost" style="margin-bottom:12px" data-a="pick:add">＋ Add exercise to this workout</button>`
  +`<div class="card" style="padding:13px 16px">
    <details>

      <p><b class="red">Stop signs</b> (any of these → stop the exercise):</p>
      <p>1. Pain in a <b>small, specific spot</b> — tendon or joint, not the muscle belly.<br>

function finishBtnHtml(){
